          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/model-async-generated.o tests/model_async_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/aram.c source/timing.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -Wl,--wrap=ufbx_load_memory -lm -o /tmp/model-async
          timeout 30s /tmp/model-async /tmp/dnd-model-fixtures
          timeout 30s /tmp/model-async /tmp/dnd-model-fixtures --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/model-async.c tests/model_async_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/aram.c source/timing.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -Wl,--wrap=ufbx_load_memory -lm -o /tmp/model-async32
          timeout 30s /tmp/model-async32 /tmp/dnd-model-fixtures --gc-stress

      - name: Report native cache statistics
        if: always()
        run: ccache --show-stats

  ide-workflow:
    needs: changes
    if: needs.changes.outputs.ide == 'true'
    name: IDE workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the shared driver and launch probe
        run: |
          dotnet build tools/DolphinDotNet.Build
          dotnet build tests/DolphinLaunchProbe
      - name: Validate sample artifact checks
        run: python tests/sample_build_validation_test.py
      - name: Validate launch lifecycle and MSBuild integration
        run: python tests/build_workflow_test.py
      - name: Build every sample solution without a native toolchain
        shell: pwsh
        run: |
          Get-ChildItem samples/*/*.sln | ForEach-Object {
            dotnet build $_.FullName -p:DndBuildNative=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build every sample with the container backend
        if: runner.os == 'Linux'
        run: |
          for solution in samples/*/*.sln; do
            dotnet build "$solution" -p:DndBuildBackend=Docker
            sample=$(basename "$solution" .sln)
            python scripts/validate_sample_build.py "samples/$sample"
          done

  portable-runtime:
    needs: changes
    if: needs.changes.outputs.portable == 'true'
    name: Portable runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test runtime
        run: |
          make -C tests test
          make -C tests clean
          make -C tests test CFLAGS='-O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -I../include'

  gamecube:
    needs: changes
    if: needs.changes.outputs.gamecube == 'true'
    name: GameCube emulator artifacts
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:20260805@sha256:13bb658d3f18903816617223f5d7c6f776d3db3ea806aae67f8d35a7a69d4c85
    env:
      CCACHE_DIR: /root/.cache/dnd-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      DND_EXI_SOURCE_DIR: ${{ github.workspace }}/build/exi-upstream
    steps:
      - uses: actions/checkout@v4
      - name: Verify libogc2 storage and GX packages
        run: |
          test -f "$DEVKITPRO/libogc2/gamecube/include/fat.h"
          dkp-pacman -Q | grep -E 'libogc2|devkitPPC'
      - name: Locate libogc installation
        run: |
          find "$DEVKITPRO" -name gccore.h -print
          find "$DEVKITPRO" -name 'libogc.a' -print
          test -f "$DEVKITPRO/libogc2/gamecube/include/gccore.h"
          test -f "$DEVKITPRO/libogc2/gamecube/lib/libogc.a"
          find "$DEVKITPRO" -name 'libbba.a' -o -name 'liblwip.a' -o -name 'libnetwork*.a' -print
      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: /root/.cache/dnd-ccache
          key: ccache-powerpc-emulator-${{ github.run_id }}
          restore-keys: |
            ccache-powerpc-emulator-
      - name: Prepare shared compiler and PowerPC cache
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ccache
          bash scripts/ci_setup_builds.sh
      - name: Generate managed GameCube AOT source
        run: |
          dotnet build samples/ManagedGameCube/ManagedGameCube.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --aot samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll generated/managed_gamecube.c
      - name: Build corrected project-owned EXI implementation
        run: bash scripts/build_exi_overlay.sh
      - name: Build ELF and DOL
        run: make V=1
      - name: Build independent DOL replacement acceptance fixtures
        run: bash tests/build_dol_replacement.sh footprint/dol-launcher
      - name: Build C# source-symbols-only Dolphin Emulator DOL
        run: |
          dotnet build samples/ManagedGameCube/ManagedGameCube.csproj -c Debug -p:DndBuildNative=false -p:DndDebugSymbols=true
          dotnet "$DND_COMPILER_DLL" --bundle samples/ManagedGameCube/bin/Debug/net8.0/ManagedGameCube.dll /tmp/dnd-emulator-debug --debug-symbols
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-emulator-debug
          test -s /tmp/dnd-emulator-debug/Game.dnd-addresses.json
          ! grep -q '\-ldb' /tmp/dnd-emulator-debug/Makefile
          test ! -f /tmp/dnd-emulator-debug/source/debug_gamecube.c
          mkdir -p footprint/debug-symbols
          cp /tmp/dnd-emulator-debug/Game.dol /tmp/dnd-emulator-debug/Game.elf /tmp/dnd-emulator-debug/dnd-il-debug.json /tmp/dnd-emulator-debug/Game.dnd-addresses.json footprint/debug-symbols/
      - name: Build managed stack and source-stepping debugger fixture
        run: |
          dotnet build tests/DebuggerStackSmoke/DebuggerStackSmoke.csproj -c Debug
          dotnet "$DND_COMPILER_DLL" --bundle tests/DebuggerStackSmoke/bin/Debug/net8.0/DebuggerStackSmoke.dll /tmp/dnd-debug-stack --platform gamecube --debug-symbols
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-debug-stack
          mkdir -p footprint/debug-stack
          cp /tmp/dnd-debug-stack/Game.dol /tmp/dnd-debug-stack/Game.elf /tmp/dnd-debug-stack/Game.dnd-addresses.json /tmp/dnd-debug-stack/dnd-il-debug.json footprint/debug-stack/
      - name: Build object and string inspection debugger fixture
        run: |
          dotnet build tests/DebuggerInspectionSmoke/DebuggerInspectionSmoke.csproj -c Debug
          dotnet "$DND_COMPILER_DLL" --bundle tests/DebuggerInspectionSmoke/bin/Debug/net8.0/DebuggerInspectionSmoke.dll /tmp/dnd-debug-inspection --platform gamecube --debug-symbols
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-debug-inspection
          mkdir -p footprint/debug-inspection
          cp /tmp/dnd-debug-inspection/Game.dol /tmp/dnd-debug-inspection/Game.elf /tmp/dnd-debug-inspection/Game.dnd-addresses.json /tmp/dnd-debug-inspection/dnd-il-debug.json footprint/debug-inspection/
      - name: Build and validate self-contained Pong GameCube DOL
        run: |
          dotnet build samples/Pong/Pong.sln -c Release -p:DndBuildBackend=Native
          test -s samples/Pong/bin/Release/net8.0/Pong.dol
          python3 scripts/dol_sections.py samples/Pong/bin/Release/net8.0/Pong.dol
          mkdir -p footprint
          cp samples/Pong/bin/Release/net8.0/Pong.dol footprint/pong.dol
          cp samples/Pong/bin/Release/net8.0/Pong.elf footprint/pong.elf
      - name: Build Green Men GameCube sample with source maps
        run: |
          dotnet build samples/GreenMen/GreenMen.sln -c Debug -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/GreenMen/bin/Debug/net8.0/GreenMen.dll footprint/green-men --debug-symbols --sample-controls
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C footprint/green-men
          python3 scripts/verify_dol_elf.py footprint/green-men/Game.elf footprint/green-men/Game.dol
          test -s footprint/green-men/Game.dnd-addresses.json
          dotnet build tests/GreenMenRulesSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/GreenMenRulesSmoke/bin/Release/net8.0/GreenMenRulesSmoke.dll /tmp/green-men-rules.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/green-men-rules.c source/numeric.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/green-men-rules.elf
          elf2dol footprint/green-men-rules.elf footprint/green-men-rules.dol
          python3 scripts/dol_sections.py --pad footprint/green-men-rules.dol
      - name: Build Fox polygon rail shooter with source maps
        run: |
          dotnet build samples/Fox/Fox.sln -c Debug -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/Fox/bin/Debug/net8.0/Fox.dll footprint/fox --debug-symbols --sample-controls
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C footprint/fox
          python3 scripts/verify_dol_elf.py footprint/fox/Game.elf footprint/fox/Game.dol
          test -s footprint/fox/Game.dnd-addresses.json
          dotnet build tests/FoxRulesSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/FoxRulesSmoke/bin/Release/net8.0/FoxRulesSmoke.dll /tmp/fox-rules.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/fox-rules.c source/numeric.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/fox-rules.elf
          elf2dol footprint/fox-rules.elf footprint/fox-rules.dol
          python3 scripts/dol_sections.py --pad footprint/fox-rules.dol
      - name: Build TEV shader demo with source maps
        run: |
          dotnet build samples/ShaderDemo/ShaderDemo.sln -c Debug -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/ShaderDemo/bin/Debug/net8.0/ShaderDemo.dll footprint/shader --debug-symbols --sample-controls
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C footprint/shader
          python3 scripts/verify_dol_elf.py footprint/shader/Game.elf footprint/shader/Game.dol
          test -s footprint/shader/Game.dnd-addresses.json
      - name: Build Kart peer-to-peer racer with source maps
        run: |
          dotnet build samples/Kart/Kart.sln -c Debug -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/Kart/bin/Debug/net8.0/Kart.dll footprint/kart --debug-symbols --sample-controls
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C footprint/kart
          python3 scripts/verify_dol_elf.py footprint/kart/Game.elf footprint/kart/Game.dol
          test -s footprint/kart/Game.dnd-addresses.json
          dotnet build tests/KartItemSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/KartItemSmoke/bin/Release/net8.0/KartItemSmoke.dll /tmp/kart-items.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/kart-items.c source/numeric.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/kart-items.elf
          elf2dol footprint/kart-items.elf footprint/kart-items.dol
          python3 scripts/dol_sections.py --pad footprint/kart-items.dol
      - name: Build and validate Snake save/load GameCube DOL
        run: |
          dotnet build samples/Snake/Snake.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/Snake/bin/Release/net8.0/Snake.dll /tmp/dnd-snake-gamecube --platform gamecube
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-snake-gamecube
          test -s /tmp/dnd-snake-gamecube/Game.dol
          python3 /tmp/dnd-snake-gamecube/scripts/dol_sections.py /tmp/dnd-snake-gamecube/Game.dol
          mkdir -p footprint
          cp /tmp/dnd-snake-gamecube/Game.dol footprint/snake.dol
          cp /tmp/dnd-snake-gamecube/Game.elf footprint/snake.elf
      - name: Build bare-metal ELF/DOL to test emulator debugger
        run: |
          mkdir -p footprint
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -c -g tests/dolphin_minimal.S -o footprint/dolphin_minimal.o
          "$DEVKITPPC/bin/powerpc-eabi-ld" -Ttext=0x80003100 -e main -o footprint/dolphin_minimal.elf footprint/dolphin_minimal.o
          elf2dol footprint/dolphin_minimal.elf footprint/dolphin_minimal.dol
          python3 scripts/dol_sections.py --pad footprint/dolphin_minimal.dol
      - name: Build independent libogc emulator control DOL
        run: |
          mkdir -p footprint
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -I"$DEVKITPRO/libogc2/gamecube/include" tests/dolphin_control.c -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/dolphin_control.elf
          elf2dol footprint/dolphin_control.elf footprint/dolphin_control.dol
          python3 scripts/dol_sections.py --pad footprint/dolphin_control.dol
      - name: Build wishlist PowerPC acceptance DOLs
        run: |
          for suite in WishlistSmoke ExactNumberSmoke; do
            dotnet build tests/$suite -c Release
            dotnet "$DND_COMPILER_DLL" --aot tests/$suite/bin/Release/net8.0/$suite.dll /tmp/$suite.c
            python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O1 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/wishlist_gamecube_entry.c /tmp/$suite.c source/numeric.c source/text.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/$suite.elf
            elf2dol footprint/$suite.elf footprint/$suite.dol
            python3 scripts/dol_sections.py --pad footprint/$suite.dol
          done
      - name: Build numeric contracts PowerPC acceptance DOL
        run: |
          dotnet build tests/NumericSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/NumericSmoke/bin/Release/net8.0/NumericSmoke.dll /tmp/numeric.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/numeric.c source/numeric.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/numeric.elf
          elf2dol footprint/numeric.elf footprint/numeric.dol
          python3 scripts/dol_sections.py --pad footprint/numeric.dol
      - name: Build string contracts PowerPC acceptance DOL
        run: |
          dotnet build tests/StringSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/StringSmoke/bin/Release/net8.0/StringSmoke.dll /tmp/strings.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/strings.c source/numeric.c source/text.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/strings.elf
          elf2dol footprint/strings.elf footprint/strings.dol
          python3 scripts/dol_sections.py --pad footprint/strings.dol
      - name: Build automatic task execution DOL
        run: |
          dotnet build tests/AutomaticTaskSmoke/AutomaticTaskSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/AutomaticTaskSmoke/bin/Release/net8.0/AutomaticTaskSmoke.dll /tmp/automatic-tasks.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/automatic-tasks.c -o /tmp/automatic-tasks.o
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/automatic-tasks.o build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/automatic_tasks.elf
          elf2dol footprint/automatic_tasks.elf footprint/automatic_tasks.dol
          python3 scripts/dol_sections.py --pad footprint/automatic_tasks.dol
      - name: Compile and link controller and timing ABI for PowerPC
        run: |
          dotnet build tests/InputSmoke/InputSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/InputSmoke/bin/Release/net8.0/InputSmoke.dll /tmp/input-smoke.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/input-smoke.c build/input.o build/input_gamecube.o build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o /tmp/input-smoke.elf
          dotnet build tests/InputContextSmoke/InputContextSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/InputContextSmoke/bin/Release/net8.0/InputContextSmoke.dll /tmp/input-contexts.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/input-contexts.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o /tmp/input-contexts.elf
          dotnet build tests/TimingSmoke/TimingSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/TimingSmoke/bin/Release/net8.0/TimingSmoke.dll /tmp/timing-smoke.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/timing-smoke.c build/timing.o build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/timing_tasks.elf
          elf2dol footprint/timing_tasks.elf footprint/timing_tasks.dol
          python3 scripts/dol_sections.py --pad footprint/timing_tasks.dol
      - name: Build managed controller pipe acceptance DOL
        run: |
          dotnet build tests/ControllerDolphinSmoke/ControllerDolphinSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/ControllerDolphinSmoke/bin/Release/net8.0/ControllerDolphinSmoke.dll /tmp/controller-dolphin.c
          bash tests/build_controller_dolphin.sh /tmp/controller-dolphin.c footprint
      - name: Build disc filesystem and DiscBrowser startup acceptance DOLs
        run: |
          mkdir -p footprint
          python3 tests/make_disc_fixture.py footprint/test-disc.iso
          python3 tests/make_disc_fixture.py footprint/test-disc-many.iso --many-files
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DDND_GAMECUBE_STORAGE -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/disc_access_gamecube.c source/disc_gamecube.c source/fst_gamecube.c source/fst.c source/iso_file.c -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -liso9660 -logc -lm -o footprint/disc_access.elf
          elf2dol footprint/disc_access.elf footprint/disc_access.dol
          python3 scripts/dol_sections.py --pad footprint/disc_access.dol
          dotnet build samples/DiscBrowser/DiscBrowser.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/DiscBrowser/bin/Release/net8.0/DiscBrowser.dll footprint/disc-browser --sample-controls
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C footprint/disc-browser
      - name: Report GameCube runtime footprint
        run: |
          mkdir -p footprint
          "$DEVKITPPC/bin/powerpc-eabi-size" DolphinDotNet.elf > footprint/elf-size.txt
          "$DEVKITPPC/bin/powerpc-eabi-nm" -S --size-sort DolphinDotNet.elf > footprint/symbol-sizes.txt
          cat footprint/elf-size.txt
          grep managed_heap_memory footprint/symbol-sizes.txt
          find build -name '*.su' -exec cat {} + > footprint/stack-usage.txt
          test -s footprint/stack-usage.txt
          cat footprint/stack-usage.txt
      - name: Verify outputs
        run: |
          test -s DolphinDotNet.elf
          test -s DolphinDotNet.dol
          python3 scripts/dol_sections.py DolphinDotNet.dol
          python3 scripts/verify_dol_elf.py DolphinDotNet.elf DolphinDotNet.dol
          "$DEVKITPPC/bin/powerpc-eabi-readelf" -h -l DolphinDotNet.elf > footprint/elf-headers.txt
          "$DEVKITPPC/bin/powerpc-eabi-objdump" -d DolphinDotNet.elf > footprint/powerpc-disassembly.txt
          test -s footprint/elf-headers.txt
          test -s footprint/powerpc-disassembly.txt
          file DolphinDotNet.elf || true
          ls -lh DolphinDotNet.elf DolphinDotNet.dol
      - uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-gamecube
          path: |
            DolphinDotNet.elf
            DolphinDotNet.dol
            DolphinDotNet.map
            footprint/
          if-no-files-found: error


  gamecube-extra:
    needs: changes
    if: needs.changes.outputs.gamecube == 'true'
    name: GameCube checks (${{ matrix.group }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:20260805@sha256:13bb658d3f18903816617223f5d7c6f776d3db3ea806aae67f8d35a7a69d4c85
    strategy:
      fail-fast: false
      matrix:
        group: [compat, samples]
    env:
      CCACHE_DIR: /root/.cache/dnd-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      DND_EXI_SOURCE_DIR: ${{ github.workspace }}/build/exi-upstream
    steps:
      - uses: actions/checkout@v4
      - name: Verify libogc2 storage and GX packages
        run: |
          test -f "$DEVKITPRO/libogc2/gamecube/include/fat.h"
          dkp-pacman -Q | grep -E 'libogc2|devkitPPC'
      - name: Locate libogc installation
        run: |
          find "$DEVKITPRO" -name gccore.h -print
          find "$DEVKITPRO" -name 'libogc.a' -print
          test -f "$DEVKITPRO/libogc2/gamecube/include/gccore.h"
          test -f "$DEVKITPRO/libogc2/gamecube/lib/libogc.a"
          find "$DEVKITPRO" -name 'libbba.a' -o -name 'liblwip.a' -o -name 'libnetwork*.a' -print
      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: /root/.cache/dnd-ccache
          key: ccache-powerpc-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            ccache-powerpc-${{ matrix.group }}-
      - name: Prepare shared compiler and PowerPC cache
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ccache
          bash scripts/ci_setup_builds.sh
      - name: Generate managed GameCube AOT source
        run: |
          dotnet build samples/ManagedGameCube/ManagedGameCube.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --aot samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll generated/managed_gamecube.c
      - name: Build corrected project-owned EXI implementation
        run: bash scripts/build_exi_overlay.sh
      - name: Build ELF and DOL
        run: make V=1
      - name: Prepare managed debug assembly for transport fixtures
        if: matrix.group == 'compat'
        run: dotnet build samples/ManagedGameCube/ManagedGameCube.csproj -c Debug -p:DndBuildNative=false -p:DndDebugSymbols=true
      - name: Build generated standalone GameCube project
        if: matrix.group == 'compat'
        run: |
          dotnet "$DND_COMPILER_DLL" --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-standalone --platform gamecube
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-standalone V=1
          test -s /tmp/dnd-standalone/Game.elf
          test -s /tmp/dnd-standalone/Game.dol
          python3 /tmp/dnd-standalone/scripts/dol_sections.py /tmp/dnd-standalone/Game.dol
      - name: Test native source-to-ELF address resolver
        if: matrix.group == 'compat'
        run: python3 -m unittest discover -s tests -p debug_address_map_test.py -v
      - name: Link USB Gecko debugger GameCube bundle
        if: matrix.group == 'compat'
        run: |
          dotnet "$DND_COMPILER_DLL" --bundle samples/ManagedGameCube/bin/Debug/net8.0/ManagedGameCube.dll /tmp/dnd-usb-gecko --gdb-usb 1
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-usb-gecko
          test -s /tmp/dnd-usb-gecko/Game.dol
          test -s /tmp/dnd-usb-gecko/Game.dnd-addresses.json
          grep -q 'DEBUG_Init(GDBSTUB_DEVICE_USB, 1)' /tmp/dnd-usb-gecko/source/debug_gamecube.c
          grep -q '\-ldb' /tmp/dnd-usb-gecko/Makefile
          "$DEVKITPPC/bin/powerpc-eabi-nm" /tmp/dnd-usb-gecko/Game.elf | grep -q ' dnd_gdb_init$'
      - name: Link opt-in GDB TCP GameCube bundle
        if: matrix.group == 'compat'
        run: |
          test -f "$DEVKITPRO/libogc2/gamecube/lib/libdb.a"
          dotnet "$DND_COMPILER_DLL" --bundle samples/ManagedGameCube/bin/Debug/net8.0/ManagedGameCube.dll /tmp/dnd-gdb-ppc --gdb-tcp 192.0.2.10 --gdb-netmask 255.255.255.0 --gdb-gateway 192.0.2.1
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-gdb-ppc
          test -s /tmp/dnd-gdb-ppc/Game.dol
          "$DEVKITPPC/bin/powerpc-eabi-readelf" -SW /tmp/dnd-gdb-ppc/Game.elf | grep -q '\.debug_info'
          "$DEVKITPPC/bin/powerpc-eabi-nm" /tmp/dnd-gdb-ppc/Game.elf | grep -q ' dnd_gdb_init$'
          "$DEVKITPPC/bin/powerpc-eabi-readelf" --debug-dump=decodedline /tmp/dnd-gdb-ppc/Game.elf | grep -q 'ManagedGameCube.*\.cs'
          test -s /tmp/dnd-gdb-ppc/Game.dnd-addresses.json
          python3 scripts/dnd_debug_addresses.py --elf /tmp/dnd-gdb-ppc/Game.elf --source-map /tmp/dnd-gdb-ppc/dnd-il-debug.json --output /tmp/dnd-gdb-ppc/manual-addresses.json --readelf "$DEVKITPPC/bin/powerpc-eabi-readelf" --require-source ManagedGameCube/Program.cs
      - name: Compile managed storage ABI for PowerPC
        if: matrix.group == 'compat'
        run: |
          dotnet build tests/StorageSmoke/StorageSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/StorageSmoke/bin/Release/net8.0/StorageSmoke.dll /tmp/storage_smoke.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/storage_smoke.c -o /tmp/storage_smoke.o
      - name: Compile standard library ABI for PowerPC
        if: matrix.group == 'compat'
        run: |
          dotnet build tests/LibrarySmoke/LibrarySmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/LibrarySmoke/bin/Release/net8.0/LibrarySmoke.dll /tmp/library.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/library.c -o /tmp/library.o
      - name: Compile managed ARAM ABI for PowerPC
        if: matrix.group == 'compat'
        run: |
          dotnet build tests/AramSmoke/AramSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/AramSmoke/bin/Release/net8.0/AramSmoke.dll /tmp/aram.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/aram.c -o /tmp/aram.o
      - name: Compile model and animation ABI for PowerPC
        if: matrix.group == 'compat'
        run: |
          dotnet build tests/ModelSmoke/ModelSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/ModelSmoke/bin/Release/net8.0/ModelSmoke.dll /tmp/model-smoke.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/model-smoke.c -o /tmp/model-smoke.o
      - name: Compile and link graphics layers for PowerPC
        if: matrix.group == 'compat'
        run: |
          dotnet build tests/GraphicsSmoke/GraphicsSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --bundle tests/GraphicsSmoke/bin/Release/net8.0/GraphicsSmoke.dll /tmp/dnd-graphics --platform gamecube
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-graphics V=1
          test -s /tmp/dnd-graphics/Game.dol
          dotnet build samples/HttpTexture/HttpTexture.sln -c Debug -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/HttpTexture/bin/Debug/net8.0/HttpTexture.dll /tmp/dnd-http-texture --debug-symbols --sample-controls
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-http-texture V=1
          test -s /tmp/dnd-http-texture/Game.dol
      - name: Test DOL alignment handling
        if: matrix.group == 'compat'
        run: python3 -m unittest discover -s tests -p test_dol_sections.py
      - name: Compile and link managed networking for GameCube
        if: matrix.group == 'compat'
        run: |
          dotnet build tests/NetworkSmoke/NetworkSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/NetworkSmoke/bin/Release/net8.0/NetworkSmoke.dll /tmp/network-smoke.c
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/network-smoke.c -o /tmp/network-smoke.o
          python3 scripts/ci_cc.py --compiler "$DEVKITPPC/bin/powerpc-eabi-gcc" -mogc -Iinclude tests/network_gamecube_entry.c /tmp/network-smoke.o build/managed_runtime.o build/async_runtime.o build/text.o build/network.o build/network_gamecube_backend.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -lbba -logc -lm -o /tmp/network-smoke.elf
      - name: Link managed AESND sample to a real GameCube DOL
        if: matrix.group == 'samples'
        run: |
          dotnet build samples/AudioDemo/AudioDemo.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/AudioDemo/bin/Release/net8.0/AudioDemo.dll /tmp/dnd-audio-demo-ppc --platform gamecube
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-audio-demo-ppc
          test -s /tmp/dnd-audio-demo-ppc/Game.dol
          python3 /tmp/dnd-audio-demo-ppc/scripts/dol_sections.py /tmp/dnd-audio-demo-ppc/Game.dol
      - name: Link GameCube audio format loaders and async API
        if: matrix.group == 'samples'
        run: |
          dotnet build tests/AudioFormatsSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --bundle tests/AudioFormatsSmoke/bin/Release/net8.0/AudioFormatsSmoke.dll /tmp/dnd-audio-formats-ppc --platform gamecube
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-audio-formats-ppc
          python3 /tmp/dnd-audio-formats-ppc/scripts/dol_sections.py /tmp/dnd-audio-formats-ppc/Game.dol
      - name: Build GameCube hardware discovery and reboot demo DOL
        if: matrix.group == 'samples'
        run: |
          dotnet build samples/HardwareDiagnostics/HardwareDiagnostics.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/HardwareDiagnostics/bin/Release/net8.0/HardwareDiagnostics.dll /tmp/dnd-hardware-demo --platform gamecube
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-hardware-demo
          test -s /tmp/dnd-hardware-demo/Game.dol
      - name: Build GameCube disc browser with libogc2 GC Loader sectors
        if: matrix.group == 'samples'
        run: |
          dotnet build samples/DiscBrowser/DiscBrowser.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --bundle samples/DiscBrowser/bin/Release/net8.0/DiscBrowser.dll /tmp/dnd-disc-browser-bundle --platform gamecube
          test -s /tmp/dnd-disc-browser-bundle/source/iso_file.c
          test -s /tmp/dnd-disc-browser-bundle/source/hardware.c
          make -j2 CC="ccache $DEVKITPPC/bin/powerpc-eabi-gcc" -C /tmp/dnd-disc-browser-bundle
          test -s /tmp/dnd-disc-browser-bundle/Game.dol
          test -s /tmp/dnd-disc-browser-bundle/source/model_obj.c
      - name: Report native cache statistics
        if: always()
        run: ccache --show-stats

  dolphin-smoke:
    name: Dolphin (${{ matrix.group }})
    runs-on: ubuntu-24.04
    needs: [changes, gamecube]
    if: needs.changes.outputs.dolphin == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [games, debugger, runtime, controllers]
    container:
      image: debian:trixie
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker shared memory
        run: |
          df -h /dev/shm
          test "$(stat -f -c %a /dev/shm)" -gt 100000
      - name: Install Dolphin and virtual display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb xauth python3 binutils libxcb-cursor0 curl ca-certificates
          test -x /usr/games/dolphin-emu-nogui
          xvfb-run -a /usr/games/dolphin-emu-nogui --version
      - name: Install shader capture decoder
        if: matrix.group == 'games'
        run: apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-dotnet@v4
        if: matrix.group == 'debugger'
        with:
          dotnet-version: '8.0.x'
      - name: Build .NET source debugger acceptance probe
        if: matrix.group == 'debugger'
        run: dotnet build tools/DolphinDotNet.Debugger.Probe -c Release
      - name: Build attach-only DAP adapter
        if: matrix.group == 'debugger'
        run: dotnet build tools/DolphinDotNet.DebugAdapter -c Release
      - name: Download GameCube DOL
        uses: actions/download-artifact@v4
        with:
          name: DolphinDotNet-gamecube
          path: dist
      - name: Test emulator log validation
        run: |
          python3 -m unittest discover -s tests -p test_dolphin_smoke.py
          python3 -m unittest discover -s tests -p test_dolphin_controller.py
      - name: Verify Pong synthesizes audio and presents frames in Dolphin
        if: matrix.group == 'games'
        id: pong_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/pong.dol --binary /usr/games/dolphin-emu-nogui --seconds 65 --minimum-seconds 65 --cpu-core 1 --gdb-port 2163 --elf dist/footprint/pong.elf --expect-symbol main --expect-symbol dnd_aot_entry --expect-symbol dnd_audio_create_pcm8 --expect-symbol dnd_device_end --logs dolphin-pong --require-boot
      - name: Verify Green Men gameplay using real controller inputs
        if: matrix.group == 'games'
        id: green_men
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/dolphin_smoke.py dist/footprint/green-men-rules.dol --binary /usr/games/dolphin-emu-nogui --seconds 25 --cpu-core 1 --gdb-port 2173 --elf dist/footprint/green-men-rules.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-green-men-rules --require-boot
          python3 scripts/dolphin_green_men_test.py dist/footprint/green-men/Game.dol --elf dist/footprint/green-men/Game.elf --source-map dist/footprint/green-men/dnd-il-debug.json --logs dolphin-green-men
      - name: Verify Fox flight using real controller inputs
        if: matrix.group == 'games'
        id: fox
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/dolphin_smoke.py dist/footprint/fox-rules.dol --binary /usr/games/dolphin-emu-nogui --seconds 25 --cpu-core 1 --gdb-port 2174 --elf dist/footprint/fox-rules.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-fox-rules --require-boot
          python3 scripts/dolphin_green_men_test.py dist/footprint/fox/Game.dol --game Fox --elf dist/footprint/fox/Game.elf --source-map dist/footprint/fox/dnd-il-debug.json --logs dolphin-fox
      - name: Verify rendered TEV shader effects in Dolphin
        if: matrix.group == 'games'
        id: shader
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s tests -p test_dolphin_shader.py
          python3 scripts/dolphin_shader_test.py dist/footprint/shader/Game.dol --logs dolphin-shader --seconds 90
      - name: Verify offline Kart track and player rendering in Dolphin
        if: matrix.group == 'games'
        id: kart
        continue-on-error: true
        run: |
          python3 scripts/dolphin_smoke.py dist/footprint/kart-items.dol --seconds 25 --cpu-core 1 --gdb-port 2189 --elf dist/footprint/kart-items.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-kart-items --require-boot
          python3 scripts/dolphin_kart_test.py dist/footprint/kart/Game.dol --logs dolphin-kart --seconds 90
      - name: Verify Snake memory card initialization and frame rendering in Dolphin
        if: matrix.group == 'games'
        id: snake_boot
        continue-on-error: true
        # No card is configured here: verify physical polling, then rendering.
        # Mounting is conditional on presence rather than attempted at startup.
        run: python3 scripts/dolphin_smoke.py dist/footprint/snake.dol --binary /usr/games/dolphin-emu-nogui --seconds 70 --minimum-seconds 70 --cpu-core 1 --gdb-port 2164 --elf dist/footprint/snake.elf --expect-symbol main --expect-symbol dnd_aot_entry --expect-symbol dnd_hardware_probe --expect-symbol dnd_device_end --logs dolphin-snake --require-boot
      - name: Verify two consecutive C# source breakpoints in Dolphin
        if: matrix.group == 'debugger'
        id: cs_breakpoints
        run: python3 scripts/dolphin_smoke.py dist/footprint/debug-symbols/Game.dol --binary /usr/games/dolphin-emu-nogui --seconds 55 --cpu-core 1 --gdb-port 2165 --elf dist/footprint/debug-symbols/Game.elf --source-map dist/footprint/debug-symbols/dnd-il-debug.json --address-map dist/footprint/debug-symbols/Game.dnd-addresses.json --expect-source ManagedGameCube/Program.cs:9 --expect-source ManagedGameCube/Program.cs:10 --logs dolphin-csharp-breakpoints --require-boot --dotnet-probe tools/DolphinDotNet.Debugger.Probe/bin/Release/net8.0/DolphinDotNet.Debugger.Probe.dll
      - name: Verify managed stack and C# Step Over/Out in Dolphin
        if: matrix.group == 'debugger'
        id: cs_stack_steps
        run: python3 scripts/dolphin_smoke.py dist/footprint/debug-stack/Game.dol --binary /usr/games/dolphin-emu-nogui --seconds 55 --cpu-core 1 --gdb-port 2166 --elf dist/footprint/debug-stack/Game.elf --source-map dist/footprint/debug-stack/dnd-il-debug.json --address-map dist/footprint/debug-stack/Game.dnd-addresses.json --expect-source DebuggerStackSmoke/Program.cs:20 --expect-source DebuggerStackSmoke/Program.cs:15 --logs dolphin-csharp-stack --require-boot --dotnet-probe tools/DolphinDotNet.Debugger.Probe/bin/Release/net8.0/DolphinDotNet.Debugger.Probe.dll --stack-steps
      - name: Verify DAP Csharp breakpoints and pause in Dolphin
        if: matrix.group == 'debugger'
        id: emulator_case_14
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/debug-symbols/Game.dol --binary /usr/games/dolphin-emu-nogui --seconds 55 --cpu-core 1 --gdb-port 2167 --elf dist/footprint/debug-symbols/Game.elf --source-map dist/footprint/debug-symbols/dnd-il-debug.json --address-map dist/footprint/debug-symbols/Game.dnd-addresses.json --expect-source ManagedGameCube/Program.cs:9 --expect-source ManagedGameCube/Program.cs:10 --logs dolphin-dap-source --require-boot --dap-adapter tools/DolphinDotNet.DebugAdapter/bin/Release/net8.0/DolphinDotNet.DebugAdapter.dll
      - name: Verify DAP managed stack, primitive inspection and Step Over/Out in Dolphin
        if: matrix.group == 'debugger'
        id: emulator_case_15
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/debug-stack/Game.dol --binary /usr/games/dolphin-emu-nogui --seconds 55 --cpu-core 1 --gdb-port 2168 --elf dist/footprint/debug-stack/Game.elf --source-map dist/footprint/debug-stack/dnd-il-debug.json --address-map dist/footprint/debug-stack/Game.dnd-addresses.json --expect-source DebuggerStackSmoke/Program.cs:20 --expect-source DebuggerStackSmoke/Program.cs:15 --logs dolphin-dap-stack --require-boot --dap-adapter tools/DolphinDotNet.DebugAdapter/bin/Release/net8.0/DolphinDotNet.DebugAdapter.dll --stack-steps
      - name: Verify DAP object fields and string previews in Dolphin
        if: matrix.group == 'debugger'
        id: emulator_case_16
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/debug-inspection/Game.dol --binary /usr/games/dolphin-emu-nogui --seconds 55 --cpu-core 1 --gdb-port 2169 --elf dist/footprint/debug-inspection/Game.elf --source-map dist/footprint/debug-inspection/dnd-il-debug.json --address-map dist/footprint/debug-inspection/Game.dnd-addresses.json --expect-source DebuggerInspectionSmoke/Program.cs:23 --logs dolphin-dap-inspection --require-boot --dap-adapter tools/DolphinDotNet.DebugAdapter/bin/Release/net8.0/DolphinDotNet.DebugAdapter.dll --inspect-objects --debugger-telemetry
      - name: Verify bare-metal main() guest PC
        if: matrix.group == 'runtime'
        id: minimal_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/dolphin_minimal.dol --binary /usr/games/dolphin-emu-nogui --seconds 12 --cpu-core 1 --gdb-port 2158 --elf dist/footprint/dolphin_minimal.elf --expect-symbol main --logs dolphin-minimal --require-boot
      - name: Verify independent libogc main() guest PC
        if: matrix.group == 'runtime'
        id: control_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/dolphin_control.dol --binary /usr/games/dolphin-emu-nogui --seconds 40 --cpu-core 1 --gdb-port 2159 --elf dist/footprint/dolphin_control.elf --expect-symbol main --logs dolphin-control --require-boot
      - name: Verify native and managed main() executed in Dolphin
        if: matrix.group == 'runtime'
        id: app_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/DolphinDotNet.dol --binary /usr/games/dolphin-emu-nogui --seconds 55 --cpu-core 1 --gdb-port 2160 --elf dist/DolphinDotNet.elf --expect-symbol main --expect-symbol dnd_aot_entry --expect-symbol "dnd_value_ManagedGameCube_Program_Main_*" --logs dolphin-smoke --require-boot
      - name: Verify string contracts on PowerPC in Dolphin
        if: matrix.group == 'runtime'
        id: strings
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/strings.dol --binary /usr/games/dolphin-emu-nogui --seconds 25 --cpu-core 1 --gdb-port 2187 --elf dist/footprint/strings.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-strings --require-boot
      - name: Verify wishlist contracts on PowerPC in Dolphin
        if: matrix.group == 'runtime'
        id: wishlist
        continue-on-error: true
        run: |
          for suite in WishlistSmoke ExactNumberSmoke; do
            python3 scripts/dolphin_smoke.py dist/footprint/$suite.dol --binary /usr/games/dolphin-emu-nogui --seconds 40 --cpu-core 1 --gdb-port 2188 --elf dist/footprint/$suite.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-$suite --require-boot
          done
      - name: Verify numeric contracts on PowerPC in Dolphin
        if: matrix.group == 'runtime'
        id: numeric
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/numeric.dol --binary /usr/games/dolphin-emu-nogui --seconds 25 --cpu-core 1 --gdb-port 2186 --elf dist/footprint/numeric.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-numeric --require-boot
      - name: Verify automatic async tasks complete and the service thread shuts down
        if: matrix.group == 'runtime'
        id: async_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/automatic_tasks.dol --binary /usr/games/dolphin-emu-nogui --seconds 40 --cpu-core 1 --gdb-port 2161 --elf dist/footprint/automatic_tasks.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-async --require-boot
      - name: Verify timing delays, callbacks and cleanup in Dolphin
        if: matrix.group == 'runtime'
        id: timing_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/timing_tasks.dol --binary /usr/games/dolphin-emu-nogui --seconds 40 --cpu-core 1 --gdb-port 2162 --elf dist/footprint/timing_tasks.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-timing --require-boot
      - name: Verify DOL handoff restarts an independent libogc runtime
        if: matrix.group == 'runtime'
        run: |
          python3 scripts/dolphin_smoke.py dist/footprint/dol-launcher/chain.dol --seconds 20 --cpu-core 1 --gdb-port 2175 --elf dist/footprint/dol-launcher/replacement.elf --expect-word dnd_dol_replacement_result=0x444f4c32 --memory-after-symbol dnd_dol_replacement_done --logs dolphin-dol-launcher --require-boot
      - name: Verify ISO mounts and file access with real GameCube newlib
        if: matrix.group == 'runtime'
        id: disc_access
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/disc_access.dol --binary /usr/games/dolphin-emu-nogui --seconds 20 --cpu-core 1 --gdb-port 2170 --elf dist/footprint/disc_access.elf --expect-word dnd_disc_test_result=0x49534f31 --memory-after-symbol dnd_disc_test_done --logs dolphin-disc-access --require-boot
      - name: Verify DiscBrowser starts without inserted media
        if: matrix.group == 'runtime'
        id: disc_browser
        continue-on-error: true
        run: |
          python3 scripts/dolphin_smoke.py dist/footprint/disc-browser/Game.dol --binary /usr/games/dolphin-emu-nogui --seconds 20 --cpu-core 1 --gdb-port 2171 --elf dist/footprint/disc-browser/Game.elf --expect-text "lines=NO GAMECUBE DISC OR DEMO ISO AVAILABLE" --memory-after-symbol dnd_device_end --logs dolphin-disc-browser --require-boot
      - name: Verify DiscBrowser reads inserted ISO metadata and files
        if: matrix.group == 'runtime'
        id: disc_browser_iso
        continue-on-error: true
        run: |
          python3 scripts/dolphin_smoke.py dist/footprint/disc-browser/Game.dol --disc dist/footprint/test-disc.iso --binary /usr/games/dolphin-emu-nogui --seconds 20 --cpu-core 1 --gdb-port 2172 --elf dist/footprint/disc-browser/Game.elf --expect-text "lines=Title: Fixture banner" --expect-text "lines=Banner RGBA size: 12288" --expect-text "lines=dvd:/top" --memory-after-symbol dnd_device_end --logs dolphin-disc-browser-iso --require-boot
          python3 scripts/dolphin_smoke.py dist/footprint/disc-browser/Game.dol --disc dist/footprint/test-disc-many.iso --binary /usr/games/dolphin-emu-nogui --seconds 20 --cpu-core 1 --gdb-port 2172 --elf dist/footprint/disc-browser/Game.elf --expect-text "lines=dvd:/file0.bin" --memory-after-symbol dnd_device_end --logs dolphin-disc-browser-many --require-boot
      - name: Verify all four controllers through Dolphin pipe inputs
        if: matrix.group == 'controllers'
        id: controller_inputs
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/dolphin_controller_test.py dist/footprint/controller.dol --elf dist/footprint/controller.elf --logs dolphin-controller --verify-rejection
      - name: Require every selected emulator check
        if: always()
        env:
          GROUP: ${{ matrix.group }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYRESULTS'
          import json, os, sys
          expected = {'games': ['pong_boot', 'snake_boot', 'green_men', 'fox', 'shader', 'kart'], 'debugger': ['cs_breakpoints', 'cs_stack_steps', 'emulator_case_14', 'emulator_case_15', 'emulator_case_16'], 'runtime': ['minimal_boot', 'control_boot', 'app_boot', 'async_boot', 'numeric', 'strings', 'wishlist', 'timing_boot', 'disc_access', 'disc_browser', 'disc_browser_iso'], 'controllers': ['controller_inputs']}
          results = json.loads(os.environ['STEP_RESULTS'])
          failed = [name for name in expected[os.environ['GROUP']] if results.get(name, {}).get('outcome') != 'success']
          if failed:
              sys.exit('Failed/missing emulator checks: ' + ', '.join(failed))
          PYRESULTS
      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-dolphin-smoke-${{ matrix.group }}
          path: |
            dolphin-minimal/
            dolphin-control/
            dolphin-smoke/
            dolphin-csharp-breakpoints/
            dolphin-csharp-stack/
            dolphin-dap-source/
            dolphin-dap-stack/
            dolphin-dap-inspection/
            dolphin-async/
            dolphin-WishlistSmoke/
            dolphin-ExactNumberSmoke/
            dolphin-numeric/
            dolphin-strings/
            dolphin-timing/
            dolphin-pong/
            dolphin-green-men/
            dolphin-shader/
            dolphin-kart/
            dolphin-kart-items/
            dolphin-fox/
            dolphin-fox-rules/
            dolphin-green-men-rules/
            dolphin-snake/
            dolphin-controller/
            dolphin-disc-access/
            dolphin-disc-browser/
            dolphin-disc-browser-iso/
            dolphin-disc-browser-many/
          if-no-files-found: warn


  ci-result:
    name: CI result
    if: always()
    runs-on: ubuntu-24.04
    needs: [changes, debugger-protocol, rider-plugin, managed, ide-workflow, portable-runtime, gamecube, gamecube-extra, dolphin-smoke]
    steps:
      - name: Require every selected check to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['JOB_RESULTS'])
          if jobs['changes']['result'] != 'success':
              sys.exit('CI selection failed')
          selected = jobs['changes']['outputs']
          groups = {'debugger-protocol': 'debugger', 'rider-plugin': 'rider', 'managed': 'managed',
                    'ide-workflow': 'ide', 'portable-runtime': 'portable',
                    'gamecube': 'gamecube', 'gamecube-extra': 'gamecube', 'dolphin-smoke': 'dolphin'}
          failed = []
          for job, group in groups.items():
              if selected.get(group) not in ('true', 'false'):
                  sys.exit('Missing or invalid selection for ' + group)
              expected = 'success' if selected[group] == 'true' else 'skipped'
              actual = jobs[job]['result']
              print(f'{job}: {actual} (expected {expected})')
              if actual != expected:
                  failed.append(job)
          if failed:
              sys.exit('Unexpected CI results: ' + ', '.join(failed))
          PY

  release-gamecube:
    name: Publish GameCube build release
    runs-on: ubuntu-latest
    needs:
      - ci-result
      - debugger-protocol
      - managed
      - ide-workflow
      - portable-runtime
      - gamecube
      - dolphin-smoke
    # Publish successful builds of main only; pull requests retain their Actions artifacts.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Download verified GameCube build
        uses: actions/download-artifact@v4
        with:
          name: DolphinDotNet-gamecube
          path: dist
      - name: Verify release files
        run: |
          test -s dist/DolphinDotNet.dol
          test -s dist/DolphinDotNet.elf
      - name: Create downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TAG="build-${BUILD_RUN}-${BUILD_ATTEMPT}"
          gh release create "$TAG" \
            dist/DolphinDotNet.dol \
            dist/DolphinDotNet.elf \
            --target "$BUILD_SHA" \
            --title "GameCube build ${BUILD_RUN} (attempt ${BUILD_ATTEMPT})" \
            --notes "Automated GameCube DOL build from commit ${BUILD_SHA}. Built and verified by CI run https://github.com/${GH_REPO}/actions/runs/${BUILD_RUN}." \
            --prerelease
