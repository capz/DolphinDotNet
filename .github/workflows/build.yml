name: build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable runtime
        run: make -C tests test

  gamecube:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DOL
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-dol
          path: DolphinDotNet.dol
