name: DolphinDotNet CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch, not unrelated PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    outputs:
      debugger: ${{ steps.select.outputs.debugger }}
      rider: ${{ steps.select.outputs.rider }}
      managed: ${{ steps.select.outputs.managed }}
      ide: ${{ steps.select.outputs.ide }}
      portable: ${{ steps.select.outputs.portable }}
      gamecube: ${{ steps.select.outputs.gamecube }}
      dolphin: ${{ steps.select.outputs.dolphin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI dependency selection
        run: |
          python3 -m unittest discover -s tests -p test_ci_changes.py
          python3 -m unittest discover -s tests -p test_ci_workflow.py
      - name: Select checks from the complete PR diff
        id: select
        run: python3 scripts/ci_changes.py

  debugger-protocol:
    needs: changes
    if: needs.changes.outputs.debugger == 'true'
    name: Host GDB protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build .NET debugger acceptance probe
        run: dotnet build tools/DolphinDotNet.Debugger.Probe -c Release
      - name: Test RSP over loopback TCP and mock serial stream
        run: dotnet run --project tests/DebuggerTests/DebuggerTests.csproj -c Release
      - name: Build attach-only DAP adapter
        run: dotnet build tools/DolphinDotNet.DebugAdapter -c Release
      - name: Test DAP process against fake RSP target
        run: python3 -m unittest discover -s tests -p test_debug_adapter.py
  rider-plugin:
    needs: changes
    if: needs.changes.outputs.rider == 'true'
    name: Rider attach plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile, test real adapter integration, package and verify Rider compatibility
        working-directory: plugins/rider
        run: gradle --no-daemon test buildPlugin verifyPlugin
      - name: Verify plugin ZIP includes the adapter and serial runtime dependencies
        run: |
          python3 - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile
          packages = list(Path('plugins/rider/build/distributions').glob('*.zip'))
          assert len(packages) == 1, packages
          with ZipFile(packages[0]) as archive:
              names = archive.namelist()
              for required in ['DolphinDotNet.DebugAdapter.dll', 'DolphinDotNet.DebugAdapter.deps.json',
                               'DolphinDotNet.DebugAdapter.runtimeconfig.json', 'DolphinDotNet.Debugger.dll', 'System.IO.Ports.dll']:
                  assert any(name.endswith('/adapter/' + required) for name in names), required
              assert any('Ports.Native' in name for name in names), 'Missing serial native runtimes'
          PYZIP
      - uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-Rider-plugin
          path: plugins/rider/build/distributions/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Rider-plugin-test-reports
          path: |
            plugins/rider/build/reports/tests/
            plugins/rider/build/reports/pluginVerifier/

  managed:
    needs: changes
    if: needs.changes.outputs.managed == 'true'
    name: Managed checks (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [compiler, io, async-network, audio-games, graphics-model]
    env:
      DND_ASYNC_MANUAL: "1"
      CCACHE_DIR: /home/runner/.cache/dnd-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dnd-ccache
          key: ccache-${{ runner.os }}-managed-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-managed-${{ matrix.group }}-
      - name: Prepare shared compiler and native object cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache gcc-multilib
          bash scripts/ci_setup_builds.sh
      - name: Validate cached compilation behavior
        run: python3 -m unittest discover -s tests -p test_ci_builds.py
      - name: Build managed DolphinDotNet libraries
        run: |
          dotnet build src/DolphinDotNet.Core/DolphinDotNet.Core.csproj -c Release
          dotnet build src/DolphinDotNet.GameCube/DolphinDotNet.GameCube.csproj -c Release
          dotnet build tools/DolphinDotNet.ApiCompat/DolphinDotNet.ApiCompat.csproj -c Release
      - name: Validate HelloGameCube through current AOT path
        if: matrix.group == 'compiler'
        run: |
          dotnet build samples/HelloGameCube/HelloGameCube.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --aot samples/HelloGameCube/bin/Release/net8.0/HelloGameCube.dll /tmp/hello-gamecube.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/hello-gamecube.c tests/hello_gamecube_host.c source/numeric.c source/text.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/hello-gamecube-test
          /tmp/hello-gamecube-test
          sh scripts/compile-sample.sh /tmp/hello-gamecube-bundle
          test -s /tmp/hello-gamecube-bundle/source/generated_program.c
      - name: Build managed GameCube sample
        if: matrix.group == 'compiler'
        run: dotnet build samples/ManagedGameCube/ManagedGameCube.csproj -c Release -p:DndBuildNative=false
      - name: Lower managed GameCube dependency graph
        if: matrix.group == 'compiler'
        run: |
          dotnet "$DND_COMPILER_DLL" --aot samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/managed_gamecube.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/managed_gamecube.c -o /tmp/managed_gamecube.o
          dotnet "$DND_COMPILER_DLL" --value-aot samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/managed_gamecube_value.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/managed_gamecube_value.c -o /tmp/managed_gamecube_value.o
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/managed_gamecube.c -DDND_GRAPHICS_TEST tests/managed_gamecube_host.c tests/graphics_compat_backend.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c source/input.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/managed-gamecube-test
          /tmp/managed-gamecube-test
      - name: Generate standalone GameCube AOT build bundle
        if: matrix.group == 'compiler'
        run: |
          dotnet "$DND_COMPILER_DLL" --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-bundle
          test -s /tmp/dnd-bundle/Makefile
          test -s /tmp/dnd-bundle/source/generated_program.c
          test -s /tmp/dnd-bundle/source/main.c
          test -s /tmp/dnd-bundle/DEPENDENCIES.txt
          dotnet "$DND_COMPILER_DLL" --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-gamecube-explicit --platform gamecube
          cmp /tmp/dnd-bundle/Makefile /tmp/dnd-gamecube-explicit/Makefile
          dotnet "$DND_COMPILER_DLL" --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-wii --platform wii
          grep -q '/libogc2/wii_rules' /tmp/dnd-wii/Makefile
          if grep -q '/libogc2/gamecube_rules' /tmp/dnd-wii/Makefile; then exit 1; fi
      - name: Compile Google logo ARAM example through AOT
        if: matrix.group == 'compiler'
        timeout-minutes: 4
        run: |
          dotnet build samples/GoogleLogoAram/GoogleLogoAram.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --aot samples/GoogleLogoAram/bin/Release/net8.0/GoogleLogoAram.dll /tmp/google-logo-aram.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/google-logo-aram.c -o /tmp/google-logo-aram.o
      - name: Compiler integration tests
        if: matrix.group == 'compiler'
        run: dotnet run --project tools/DolphinDotNet.Compiler.Tests/DolphinDotNet.Compiler.Tests.csproj
      - name: Validate managed numeric contracts and floating-point semantics
        if: matrix.group == 'compiler'
        run: |
          dotnet run --project tests/NumericSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/NumericSmoke/bin/Release/net8.0/NumericSmoke.dll /tmp/numeric.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/numeric.c tests/numeric_host.c source/numeric.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/numeric
          /tmp/numeric
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/numeric.c tests/numeric_host.c source/numeric.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/numeric32
          /tmp/numeric32
      - name: Validate string operations, formatting and interpolation
        if: matrix.group == 'compiler'
        run: |
          dotnet run --project tests/StringSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/StringSmoke/bin/Release/net8.0/StringSmoke.dll /tmp/strings.c
          cc -pthread -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/strings.c tests/string_host.c source/numeric.c source/text.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/strings
          /tmp/strings
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/strings.c tests/string_host.c source/numeric.c source/text.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/strings32
          /tmp/strings32
      - name: Validate wishlist collections, arrays, exact numbers and text
        if: matrix.group == 'compiler'
        run: |
          for suite in WishlistSmoke ExactNumberSmoke; do
            dotnet run --project tests/$suite -c Release
            dotnet "$DND_COMPILER_DLL" --aot tests/$suite/bin/Release/net8.0/$suite.dll /tmp/$suite.c
            cc -pthread -O0 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/$suite.c tests/wishlist_host.c source/numeric.c source/text.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/$suite
            /tmp/$suite
            cc -pthread -m32 -O1 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/$suite.c tests/wishlist_host.c source/numeric.c source/text.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/${suite}32
            /tmp/${suite}32
          done
      - name: Build control-flow smoke assembly
        if: matrix.group == 'compiler'
        run: |
          dotnet build tests/ControlFlowSmoke/ControlFlowSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --value-aot tests/ControlFlowSmoke/bin/Release/net8.0/ControlFlowSmoke.dll /tmp/control_flow_value.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/control_flow_value.c tests/control_flow_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/control_flow_value
          /tmp/control_flow_value
      - name: Build AOT smoke assembly
        if: matrix.group == 'compiler'
        run: dotnet build tests/AotSmoke/AotSmoke.csproj -c Release
      - name: Lower AOT smoke assembly to native C
        if: matrix.group == 'compiler'
        run: dotnet "$DND_COMPILER_DLL" --aot tests/AotSmoke/bin/Release/net8.0/AotSmoke.dll /tmp/aot_smoke.c
      - name: Compile generated AOT C
        if: matrix.group == 'compiler'
        run: cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/aot_smoke.c -o /tmp/aot_smoke.o
      - name: Compile and execute generic sharing integration smoke
        if: matrix.group == 'compiler'
        timeout-minutes: 3
        run: |
          dotnet build tests/GenericSharingSmoke/GenericSharingSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --value-aot tests/GenericSharingSmoke/bin/Release/net8.0/GenericSharingSmoke.dll /tmp/generic_sharing_value.c
          echo 'Primitive formatting calls in generated C:'
          grep -n -E 'dnd_string_from_(u64|i64)' /tmp/generic_sharing_value.c | head -60 || true
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/generic_sharing_value.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c source/numeric.c source/text.c -lm -o /tmp/generic_sharing_value
          timeout 30s /tmp/generic_sharing_value
          timeout 30s /tmp/generic_sharing_value --gc-stress
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/generic_sharing_value.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c source/numeric.c source/text.c -lm -o /tmp/generic_sharing_sanitized
          timeout 30s /tmp/generic_sharing_sanitized --gc-stress
      - name: Test and package save-image command-line tool
        if: matrix.group == 'io'
        run: |
          dotnet run --project tests/SaveImageTests/SaveImageTests.csproj -c Release -- --emit-source /tmp/embedded-icon
          dotnet run --project /tmp/embedded-icon/Embedded.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot /tmp/embedded-icon/bin/Release/net8.0/Embedded.dll /tmp/embedded-icon.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/embedded-icon.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/embedded-icon-test
          /tmp/embedded-icon-test
          /tmp/embedded-icon-test --gc-stress
          dotnet pack tools/DolphinDotNet.SaveImage/DolphinDotNet.SaveImage.csproj -c Release -o /tmp/dnd-tools
          dotnet tool install DolphinDotNet.SaveImage --version 0.1.0 --add-source /tmp/dnd-tools --tool-path /tmp/dnd-tool-install
          /tmp/dnd-tool-install/dnd-save-image --help
      - name: Validate standard List, comparers, streams, text and async state machines
        if: matrix.group == 'io'
        timeout-minutes: 4
        run: |
          dotnet build tests/LibrarySmoke/LibrarySmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/LibrarySmoke/bin/Release/net8.0/LibrarySmoke.dll /tmp/library.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/library.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c source/text.c -o /tmp/library
          timeout 30s /tmp/library
          timeout 30s /tmp/library --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/library.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c source/text.c -o /tmp/library_32
          timeout 30s /tmp/library_32
          timeout 30s /tmp/library_32 --gc-stress
      - name: Validate hardware probing contracts and AOT platform intrinsics
        if: matrix.group == 'io'
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/hardware_native_test.c source/hardware.c -o /tmp/dnd-hardware-native
          /tmp/dnd-hardware-native
          dotnet build samples/HardwareDiagnostics/HardwareDiagnostics.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --aot samples/HardwareDiagnostics/bin/Release/net8.0/HardwareDiagnostics.dll /tmp/dnd-hardware-aot.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/dnd-hardware-aot.c -o /tmp/dnd-hardware-aot.o
          grep -q 'dnd_hardware_probe' /tmp/dnd-hardware-aot.c
          grep -q 'dnd_platform_reboot' /tmp/dnd-hardware-aot.c
          grep -q 'dnd_platform_reset_button' /tmp/dnd-hardware-aot.c
      - name: Validate controller and memory-card connection transitions
        if: matrix.group == 'io'
        env:
          DND_ASYNC_MANUAL: "0"
        run: |
          dotnet build tests/ConnectionSmoke/ConnectionSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/ConnectionSmoke/bin/Release/net8.0/ConnectionSmoke.dll /tmp/dnd-connections.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/dnd-connections.c tests/connection_host.c source/input.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/dnd-connections
          /tmp/dnd-connections
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/dnd-connections.c tests/connection_host.c source/input.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/dnd-connections32
          /tmp/dnd-connections32
      - name: Verify disc identities and BNR1/BNR2 artwork metadata
        if: matrix.group == 'io'
        run: |
          dotnet run --project tests/DiscIdentityTests/DiscIdentityTests.csproj -c Release
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -Iinclude tests/fst_test.c source/fst.c -o /tmp/dnd-fst-header
          /tmp/dnd-fst-header
      - name: Validate GameCube ISO image parser and mounted-image sample
        if: matrix.group == 'io'
        run: |
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -Iinclude tests/iso_image_test.c source/iso_file.c source/fst.c -o /tmp/dnd-iso-image
          /tmp/dnd-iso-image
          dotnet build samples/DiscBrowser/DiscBrowser.csproj -c Release -p:DndBuildNative=false
          dotnet "$DND_COMPILER_DLL" --aot samples/DiscBrowser/bin/Release/net8.0/DiscBrowser.dll /tmp/dnd-disc-browser.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/dnd-disc-browser.c -o /tmp/dnd-disc-browser.o
          grep -q 'dnd_storage_mount_disc_image' /tmp/dnd-disc-browser.c
          grep -q 'dnd_storage_mount_disc' /tmp/dnd-disc-browser.c
          grep -q 'dnd_storage_disc_header' /tmp/dnd-disc-browser.c
      - name: Validate DOL preparation and deferred launch APIs
        if: matrix.group == 'io'
        run: |
          dotnet build tests/DolLauncherSmoke -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/DolLauncherSmoke/bin/Release/net8.0/DolLauncherSmoke.dll /tmp/dol-launcher.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/dol-launcher.c tests/dol_host.c source/dol.c source/storage.c source/managed_runtime.c source/async_runtime.c source/text.c -o /tmp/dol-launcher
          /tmp/dol-launcher
          /tmp/dol-launcher --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/dol-launcher.c tests/dol_host.c source/dol.c source/storage.c source/managed_runtime.c source/async_runtime.c source/text.c -o /tmp/dol-launcher32
          /tmp/dol-launcher32 --gc-stress
      - name: Validate collections and storage I/O
        if: matrix.group == 'io'
        timeout-minutes: 3
        run: |
          dotnet build tests/StorageSmoke/StorageSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/StorageSmoke/bin/Release/net8.0/StorageSmoke.dll /tmp/storage.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/storage.c tests/storage_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/text.c -o /tmp/storage
          timeout 30s /tmp/storage
          timeout 30s /tmp/storage --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/storage.c tests/storage_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/text.c -o /tmp/storage32
          timeout 30s /tmp/storage32
          timeout 30s /tmp/storage32 --gc-stress
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -Iinclude tests/storage_faults.c source/managed_runtime.c source/async_runtime.c source/storage.c -Wl,--wrap=read,--wrap=write,--wrap=close -o /tmp/storage_faults
          timeout 30s /tmp/storage_faults
      - name: Validate ARAM transfers and asset cache
        if: matrix.group == 'io'
        # Networking is tested through generated native code, not a desktop CLR facade.
        timeout-minutes: 4
        run: |
          dotnet build tests/AramSmoke/AramSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/AramSmoke/bin/Release/net8.0/AramSmoke.dll /tmp/aram.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/aram.c tests/aram_host.c source/managed_runtime.c source/async_runtime.c source/aram.c -o /tmp/aram
          timeout 30s /tmp/aram
          timeout 30s /tmp/aram --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/aram.c tests/aram_host.c source/managed_runtime.c source/async_runtime.c source/aram.c -o /tmp/aram32
          timeout 30s /tmp/aram32 --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -DDND_ARAM_TEST -Iinclude tests/aram_test.c source/aram.c -o /tmp/aram-native32
          /tmp/aram-native32
      - name: Validate controller snapshots, bindings and executor ownership
        if: matrix.group == 'async-network'
        env:
          DND_ASYNC_MANUAL: "0"
        timeout-minutes: 4
        run: |
          dotnet build tests/InputSmoke/InputSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/InputSmoke/bin/Release/net8.0/InputSmoke.dll /tmp/input-smoke.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/input-smoke.c tests/input_host.c source/input.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/input-smoke
          /tmp/input-smoke
      - name: Validate input contexts and binding capture
        if: matrix.group == 'async-network'
        timeout-minutes: 4
        run: |
          dotnet run --project tests/InputContextSmoke/InputContextSmoke.csproj -c Release
          dotnet "$DND_COMPILER_DLL" --aot tests/InputContextSmoke/bin/Release/net8.0/InputContextSmoke.dll /tmp/input-contexts.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/input-contexts.c tests/input_context_host.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/input-contexts
          /tmp/input-contexts
      - name: Validate clocks, frame timing, Task.Delay and captured timers
        if: matrix.group == 'async-network'
        env:
          DND_ASYNC_MANUAL: "0"
        timeout-minutes: 4
        run: |
          dotnet build tests/TimingSmoke/TimingSmoke.csproj -c Release
