name: DolphinDotNet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/model-import-compatibility-phase1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select relevant framework checks
    runs-on: macos-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      framework: ${{ steps.select.outputs.framework }}
      debugger: ${{ steps.select.outputs.debugger }}
      ide: ${{ steps.select.outputs.ide }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI dependency selection and job invariants
        run: |
          python3 -m unittest discover -s tests -p test_ci_changes.py
          python3 -m unittest discover -s tests -p test_ci_workflow.py
          python3 -m unittest discover -s tests -p test_debugger_dependency.py
      - name: Select checks from the entire PR diff
        id: select
        run: python3 scripts/ci_changes.py

  framework-tests:
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    name: Framework / ${{ matrix.area }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set up optional audio conversion dependency
        if: matrix.area == 'audio'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
      - name: Run component integration tests
        run: python3 scripts/ci_test_suite.py ${{ matrix.area }}

  debugger-protocol:
    needs: changes
    if: needs.changes.outputs.debugger == 'true'
    name: Host debugger compatibility
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate pinned debugger source and integration
        run: python3 eng/check_debugger.py

  ide-workflow:
    needs: changes
    if: needs.changes.outputs.ide == 'true'
    name: Build driver and launch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build driver and framework-owned launch fixture
        run: |
          dotnet build tools/DolphinDotNet.Build
          dotnet build tests/DolphinLaunchProbe
      - name: Run self-contained build and launch tests
        run: |
          python tests/sample_build_validation_test.py
          python tests/build_workflow_test.py

  ci-result:
    name: CI result
    if: always()
    needs: [changes, framework-tests, debugger-protocol, ide-workflow]
    runs-on: macos-latest
    steps:
      - name: Require every selected area to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          jobs=json.loads(os.environ['JOB_RESULTS'])
          if jobs['changes']['result']!='success':
              sys.exit('CI selection failed')
          selected=jobs['changes']['outputs']
          expectations={'framework-tests':'framework','debugger-protocol':'debugger','ide-workflow':'ide'}
          for name,key in expectations.items():
              value=selected.get(key)
              if value not in ('true','false'):
                  sys.exit('Invalid selection: '+key)
              expected='success' if value=='true' else 'skipped'
              result=jobs[name]['result']
              print(name,result,'expected',expected)
              if result!=expected:
                  sys.exit('Required CI check failed or unexpectedly skipped: '+name)
          PY
