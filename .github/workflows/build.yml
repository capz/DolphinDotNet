name: DolphinDotNet CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    name: Managed compiler
    env:
      DND_ASYNC_MANUAL: "1"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build managed DolphinDotNet libraries
        run: |
          dotnet build src/DolphinDotNet.Core/DolphinDotNet.Core.csproj -c Release
          dotnet build src/DolphinDotNet.GameCube/DolphinDotNet.GameCube.csproj -c Release
          dotnet build tools/DolphinDotNet.ApiCompat/DolphinDotNet.ApiCompat.csproj -c Release
      - name: Validate audio conversion and named loop sidecars
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          dotnet run --project tests/AudioAssetTests/AudioAssetTests.csproj -c Release
      - name: Test and package save-image command-line tool
        run: |
          dotnet run --project tests/SaveImageTests/SaveImageTests.csproj -c Release -- --emit-source /tmp/embedded-icon
          dotnet run --project /tmp/embedded-icon/Embedded.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot /tmp/embedded-icon/bin/Release/net8.0/Embedded.dll /tmp/embedded-icon.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/embedded-icon.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/embedded-icon-test
          /tmp/embedded-icon-test
          /tmp/embedded-icon-test --gc-stress
          dotnet pack tools/DolphinDotNet.SaveImage/DolphinDotNet.SaveImage.csproj -c Release -o /tmp/dnd-tools
          dotnet tool install DolphinDotNet.SaveImage --version 0.1.0 --add-source /tmp/dnd-tools --tool-path /tmp/dnd-tool-install
          /tmp/dnd-tool-install/dnd-save-image --help
      - name: Validate HelloGameCube through current AOT path
        run: |
          dotnet build samples/HelloGameCube/HelloGameCube.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/HelloGameCube/bin/Release/net8.0/HelloGameCube.dll /tmp/hello-gamecube.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/hello-gamecube.c tests/hello_gamecube_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/hello-gamecube-test
          /tmp/hello-gamecube-test
          sh scripts/compile-sample.sh /tmp/hello-gamecube-bundle
          test -s /tmp/hello-gamecube-bundle/source/generated_program.c
      - name: Build managed GameCube sample
        run: dotnet build samples/ManagedGameCube/ManagedGameCube.csproj -c Release -p:DndBuildNative=false
      - name: Lower managed GameCube dependency graph
        run: |
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/managed_gamecube.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/managed_gamecube.c -o /tmp/managed_gamecube.o
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --value-aot samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/managed_gamecube_value.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/managed_gamecube_value.c -o /tmp/managed_gamecube_value.o
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/managed_gamecube.c -DDND_GRAPHICS_TEST tests/managed_gamecube_host.c tests/graphics_compat_backend.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c source/input.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/managed-gamecube-test
          /tmp/managed-gamecube-test
      - name: Validate raw and managed graphics layers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib
          python3 tools/gx-bindings/generate.py
          git diff --exit-code -- src/DolphinDotNet.GameCube/Dolphin/Graphics/Raw include/dnd_gx_raw.h source/gx_raw.c tools/DolphinDotNet.Compiler/RawGXBindings.Generated.cs
          dotnet build tests/GraphicsSmoke/GraphicsSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/GraphicsSmoke/bin/Release/net8.0/GraphicsSmoke.dll /tmp/graphics-smoke.c
          cc -pthread -DDND_GRAPHICS_TEST -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/graphics-smoke.c tests/graphics_host.c tests/graphics_backend.c source/graphics_device.c source/draw_resources.c source/gx_raw.c source/gx_guard.c source/model*.c source/storage.c source/managed_runtime.c source/async_runtime.c source/performance.c -lm -o /tmp/graphics-smoke
          /tmp/graphics-smoke
          DND_ASYNC_MANUAL=0 /tmp/graphics-smoke
          cc -pthread -m32 -DDND_GRAPHICS_TEST -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/graphics-smoke.c tests/graphics_host.c tests/graphics_backend.c source/graphics_device.c source/draw_resources.c source/gx_raw.c source/gx_guard.c source/model*.c source/storage.c source/managed_runtime.c source/async_runtime.c source/performance.c -lm -o /tmp/graphics-smoke32
          /tmp/graphics-smoke32
      - name: Generate standalone GameCube AOT build bundle
        run: |
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-bundle
          test -s /tmp/dnd-bundle/Makefile
          test -s /tmp/dnd-bundle/source/generated_program.c
          test -s /tmp/dnd-bundle/source/main.c
          test -s /tmp/dnd-bundle/DEPENDENCIES.txt
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-gamecube-explicit --platform gamecube
          cmp /tmp/dnd-bundle/Makefile /tmp/dnd-gamecube-explicit/Makefile
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-wii --platform wii
          grep -q '/libogc2/wii_rules' /tmp/dnd-wii/Makefile
          if grep -q '/libogc2/gamecube_rules' /tmp/dnd-wii/Makefile; then exit 1; fi
      - name: Validate controller snapshots, bindings and executor ownership
        env:
          DND_ASYNC_MANUAL: "0"
        timeout-minutes: 4
        run: |
          dotnet build tests/InputSmoke/InputSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/InputSmoke/bin/Release/net8.0/InputSmoke.dll /tmp/input-smoke.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/input-smoke.c tests/input_host.c source/input.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/input-smoke
          /tmp/input-smoke
      - name: Validate input contexts and binding capture
        timeout-minutes: 4
        run: |
          dotnet run --project tests/InputContextSmoke/InputContextSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/InputContextSmoke/bin/Release/net8.0/InputContextSmoke.dll /tmp/input-contexts.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/input-contexts.c tests/input_context_host.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/input-contexts
          /tmp/input-contexts
      - name: Validate native WAV parser, voice ownership and DSP controls
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O2 -Iinclude tests/audio_native_test.c source/audio.c -lm -o /tmp/dnd-audio-native
          /tmp/dnd-audio-native
      - name: Validate GameCube audio containers, decoders and AESND callbacks
        run: |
          python3 tests/generate_audio_fixtures.py /tmp/dnd-audio-fixtures/sd/audio
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -Iinclude tests/audio_formats_test.c source/audio.c -lm -o /tmp/dnd-audio-formats
          /tmp/dnd-audio-formats /tmp/dnd-audio-fixtures/sd/audio
          cc -m32 -std=c11 -Wall -Wextra -Werror -O2 -Iinclude tests/audio_formats_test.c source/audio.c -lm -o /tmp/dnd-audio-formats32
          /tmp/dnd-audio-formats32 /tmp/dnd-audio-fixtures/sd/audio
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Itests/audio_sdk -Iinclude tests/audio_backend_test.c source/audio_gamecube.c -lm -o /tmp/dnd-audio-callbacks
          /tmp/dnd-audio-callbacks
      - name: Validate GameCube audio awaits, background loading and cancellation
        env:
          DND_ASYNC_MANUAL: "0"
        run: |
          dotnet build tests/AudioFormatsSmoke -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/AudioFormatsSmoke/bin/Release/net8.0/AudioFormatsSmoke.dll /tmp/dnd-audio-formats-aot.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -O0 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Iinclude /tmp/dnd-audio-formats-aot.c tests/audio_formats_host.c source/audio.c source/managed_runtime.c source/async_runtime.c source/storage.c source/performance.c -lm -o /tmp/dnd-audio-formats-aot
          /tmp/dnd-audio-formats-aot /tmp/dnd-audio-fixtures --gc-stress
      - name: Compile managed AESND audio sample through current AOT pipeline
        run: |
          dotnet build samples/AudioDemo/AudioDemo.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/AudioDemo/bin/Release/net8.0/AudioDemo.dll /tmp/dnd-audio-demo.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/dnd-audio-demo.c -o /tmp/dnd-audio-demo.o
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/AudioDemo/bin/Release/net8.0/AudioDemo.dll /tmp/dnd-audio-bundle
          grep -q -- '-laesnd' /tmp/dnd-audio-bundle/Makefile
          test -s /tmp/dnd-audio-bundle/source/audio_gamecube.c
      - name: Test Pong gameplay and synthesized waveforms on host
        run: |
          dotnet run --project tests/PongRulesSmoke/PongRulesSmoke.csproj -c Release
      - name: Compile self-contained two-player Pong through managed AOT
        run: |
          dotnet build samples/Pong/Pong.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/Pong/bin/Release/net8.0/Pong.dll /tmp/dnd-pong.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/dnd-pong.c -o /tmp/dnd-pong.o
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/Pong/bin/Release/net8.0/Pong.dll /tmp/dnd-pong-bundle
          test -s /tmp/dnd-pong-bundle/source/generated_program.c
          test -s /tmp/dnd-pong-bundle/vendor/libogc2/exi.c
          test -s /tmp/dnd-pong-bundle/scripts/build_exi_overlay.sh
          grep -q -- 'build/exi-overlay' /tmp/dnd-pong-bundle/Makefile
          grep -q -- '-DDND_NO_AUTONETWORK' /tmp/dnd-pong-bundle/Makefile
          grep -q -- '-laesnd' /tmp/dnd-pong-bundle/Makefile
      - name: Test Snake rules, state persistence and timed autosaves
        run: dotnet run --project tests/SnakeRulesSmoke/SnakeRulesSmoke.csproj -c Release
      - name: Compile Snake save/load game through managed AOT
        run: |
          dotnet build samples/Snake/Snake.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/Snake/bin/Release/net8.0/Snake.dll /tmp/dnd-snake.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/dnd-snake.c -o /tmp/dnd-snake.o
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/Snake/bin/Release/net8.0/Snake.dll /tmp/dnd-snake-bundle --platform gamecube
          test -s /tmp/dnd-snake-bundle/source/generated_program.c
          grep -q 'dnd_card_mount' /tmp/dnd-snake-bundle/source/generated_program.c
          grep -q 'dnd_card_write_save' /tmp/dnd-snake-bundle/source/generated_program.c
          grep -q -- '-DDND_NO_AUTONETWORK' /tmp/dnd-snake-bundle/Makefile
      - name: Compile Google logo ARAM example through AOT
        timeout-minutes: 4
        run: |
          dotnet build samples/GoogleLogoAram/GoogleLogoAram.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/GoogleLogoAram/bin/Release/net8.0/GoogleLogoAram.dll /tmp/google-logo-aram.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/google-logo-aram.c -o /tmp/google-logo-aram.o
      - name: Validate clocks, frame timing, Task.Delay and captured timers
        env:
          DND_ASYNC_MANUAL: "0"
        timeout-minutes: 4
        run: |
          dotnet build tests/TimingSmoke/TimingSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/TimingSmoke/bin/Release/net8.0/TimingSmoke.dll /tmp/timing-smoke.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/timing-smoke.c tests/timing_host.c source/timing.c source/managed_runtime.c source/async_runtime.c -o /tmp/timing-smoke
          /tmp/timing-smoke
      - name: Compiler integration tests
        run: dotnet run --project tools/DolphinDotNet.Compiler.Tests/DolphinDotNet.Compiler.Tests.csproj
      - name: Build control-flow smoke assembly
        run: |
          dotnet build tests/ControlFlowSmoke/ControlFlowSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --value-aot tests/ControlFlowSmoke/bin/Release/net8.0/ControlFlowSmoke.dll /tmp/control_flow_value.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/control_flow_value.c tests/control_flow_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/control_flow_value
          /tmp/control_flow_value
      - name: Build AOT smoke assembly
        run: dotnet build tests/AotSmoke/AotSmoke.csproj -c Release
      - name: Lower AOT smoke assembly to native C
        run: dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/AotSmoke/bin/Release/net8.0/AotSmoke.dll /tmp/aot_smoke.c
      - name: Compile generated AOT C
        run: cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/aot_smoke.c -o /tmp/aot_smoke.o
      - name: Compile and execute generic sharing integration smoke
        timeout-minutes: 3
        run: |
          dotnet build tests/GenericSharingSmoke/GenericSharingSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --value-aot tests/GenericSharingSmoke/bin/Release/net8.0/GenericSharingSmoke.dll /tmp/generic_sharing_value.c
          echo 'Primitive formatting calls in generated C:'
          grep -n -E 'dnd_string_from_(u64|i64)' /tmp/generic_sharing_value.c | head -60 || true
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/generic_sharing_value.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/generic_sharing_value
          timeout 30s /tmp/generic_sharing_value
          timeout 30s /tmp/generic_sharing_value --gc-stress
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/generic_sharing_value.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/generic_sharing_sanitized
          timeout 30s /tmp/generic_sharing_sanitized --gc-stress
      - name: Validate 32-bit managed dispatch and GC
        run: |
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/timing-smoke.c tests/timing_host.c source/timing.c source/managed_runtime.c source/async_runtime.c -o /tmp/timing-smoke32
          DND_ASYNC_MANUAL=0 /tmp/timing-smoke32
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/input-smoke.c tests/input_host.c source/input.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/input-smoke32
          DND_ASYNC_MANUAL=0 /tmp/input-smoke32
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/input-contexts.c tests/input_context_host.c source/managed_runtime.c source/async_runtime.c -lm -o /tmp/input-contexts32
          /tmp/input-contexts32
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/generic_sharing_value.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/generic_sharing_32
          timeout 30s /tmp/generic_sharing_32
          timeout 30s /tmp/generic_sharing_32 --gc-stress
      - name: Validate standard List, comparers, streams, text and async state machines
        timeout-minutes: 4
        run: |
          dotnet build tests/LibrarySmoke/LibrarySmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/LibrarySmoke/bin/Release/net8.0/LibrarySmoke.dll /tmp/library.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/library.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c source/text.c -o /tmp/library
          timeout 30s /tmp/library
          timeout 30s /tmp/library --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/library.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c source/text.c -o /tmp/library_32
          timeout 30s /tmp/library_32
          timeout 30s /tmp/library_32 --gc-stress
      - name: Validate network fixture watchdog
        run: python3 -m unittest discover -s tests -p test_network_fixtures.py
      - name: Validate automatic async HTTP and ARAM without application pumps
        timeout-minutes: 8
        env:
          DND_ASYNC_MANUAL: "0"
        run: |
          dotnet build tests/AutomaticAsyncSmoke/AutomaticAsyncSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/AutomaticAsyncSmoke/bin/Release/net8.0/AutomaticAsyncSmoke.dll /tmp/automatic-async.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/automatic-async.c tests/automatic_async_host.c source/managed_runtime.c source/async_runtime.c source/text.c source/network.c source/network_posix.c source/aram.c -o /tmp/automatic-async
          python3 tests/network_fixtures.py --timeout-seconds 120 /tmp/automatic-async
          python3 tests/network_fixtures.py --timeout-seconds 120 /tmp/automatic-async --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/automatic-async.c tests/automatic_async_host.c source/managed_runtime.c source/async_runtime.c source/text.c source/network.c source/network_posix.c source/aram.c -o /tmp/automatic-async32
          # GC stress and serialized executor handoffs can exceed the
          # default 45-second fixture budget on shared runners; retain a watchdog.
          python3 tests/network_fixtures.py --timeout-seconds 120 /tmp/automatic-async32 --gc-stress
      - name: Validate cooperative async and namespace interoperability
        timeout-minutes: 4
        run: |
          dotnet build tests/AsyncSmoke/AsyncSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/AsyncSmoke/bin/Release/net8.0/AsyncSmoke.dll /tmp/async-smoke.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/async-smoke.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/async-smoke
          timeout 30s /tmp/async-smoke
          timeout 30s /tmp/async-smoke --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/async-smoke.c tests/generic_sharing_value_host.c source/managed_runtime.c source/async_runtime.c -o /tmp/async-smoke32
          timeout 30s /tmp/async-smoke32 --gc-stress
      - name: Validate hardware probing contracts and AOT platform intrinsics
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/hardware_native_test.c source/hardware.c -o /tmp/dnd-hardware-native
          /tmp/dnd-hardware-native
          dotnet build samples/HardwareDiagnostics/HardwareDiagnostics.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/HardwareDiagnostics/bin/Release/net8.0/HardwareDiagnostics.dll /tmp/dnd-hardware-aot.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/dnd-hardware-aot.c -o /tmp/dnd-hardware-aot.o
          grep -q 'dnd_hardware_probe' /tmp/dnd-hardware-aot.c
          grep -q 'dnd_platform_reboot' /tmp/dnd-hardware-aot.c
          grep -q 'dnd_platform_reset_button' /tmp/dnd-hardware-aot.c
      - name: Verify disc identities and BNR1/BNR2 artwork metadata
        run: |
          dotnet run --project tests/DiscIdentityTests/DiscIdentityTests.csproj -c Release
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -Iinclude tests/fst_test.c source/fst.c -o /tmp/dnd-fst-header
          /tmp/dnd-fst-header
      - name: Validate GameCube ISO image parser and mounted-image sample
        run: |
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -Iinclude tests/iso_image_test.c source/iso_file.c source/fst.c -o /tmp/dnd-iso-image
          /tmp/dnd-iso-image
          dotnet build samples/DiscBrowser/DiscBrowser.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/DiscBrowser/bin/Release/net8.0/DiscBrowser.dll /tmp/dnd-disc-browser.c
          cc -pthread -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/dnd-disc-browser.c -o /tmp/dnd-disc-browser.o
          grep -q 'dnd_storage_mount_disc_image' /tmp/dnd-disc-browser.c
          grep -q 'dnd_storage_mount_disc' /tmp/dnd-disc-browser.c
          grep -q 'dnd_storage_disc_header' /tmp/dnd-disc-browser.c
      - name: Validate collections and storage I/O
        timeout-minutes: 3
        run: |
          dotnet build tests/StorageSmoke/StorageSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/StorageSmoke/bin/Release/net8.0/StorageSmoke.dll /tmp/storage.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/storage.c tests/storage_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/text.c -o /tmp/storage
          timeout 30s /tmp/storage
          timeout 30s /tmp/storage --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/storage.c tests/storage_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/text.c -o /tmp/storage32
          timeout 30s /tmp/storage32
          timeout 30s /tmp/storage32 --gc-stress
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -Iinclude tests/storage_faults.c source/managed_runtime.c source/async_runtime.c source/storage.c -Wl,--wrap=read,--wrap=write,--wrap=close -o /tmp/storage_faults
          timeout 30s /tmp/storage_faults
      - name: Validate ARAM transfers and asset cache
        # Networking is tested through generated native code, not a desktop CLR facade.
        timeout-minutes: 4
        run: |
          dotnet build tests/AramSmoke/AramSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/AramSmoke/bin/Release/net8.0/AramSmoke.dll /tmp/aram.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/aram.c tests/aram_host.c source/managed_runtime.c source/async_runtime.c source/aram.c -o /tmp/aram
          timeout 30s /tmp/aram
          timeout 30s /tmp/aram --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/aram.c tests/aram_host.c source/managed_runtime.c source/async_runtime.c source/aram.c -o /tmp/aram32
          timeout 30s /tmp/aram32 --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -DDND_ARAM_TEST -Iinclude tests/aram_test.c source/aram.c -o /tmp/aram-native32
          /tmp/aram-native32
      - name: Validate managed networking, DNS, HTTP and JSON
        timeout-minutes: 5
        run: |
          dotnet build tests/NetworkSmoke/NetworkSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/NetworkSmoke/bin/Release/net8.0/NetworkSmoke.dll /tmp/network-smoke.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/network-smoke.c tests/network_host.c source/managed_runtime.c source/async_runtime.c source/text.c source/network.c source/network_posix.c -o /tmp/network-smoke
          python3 tests/network_fixtures.py /tmp/network-smoke
          python3 tests/network_fixtures.py /tmp/network-smoke --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/network-smoke.c tests/network_host.c source/managed_runtime.c source/async_runtime.c source/text.c source/network.c source/network_posix.c -o /tmp/network-smoke32
          python3 tests/network_fixtures.py /tmp/network-smoke32 --gc-stress
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude tests/network_native_test.c source/managed_runtime.c source/async_runtime.c source/network.c source/network_posix.c -o /tmp/network-native
          /tmp/network-native
      - name: Validate documented async networking example
        env:
          DND_ASYNC_MANUAL: "0"
        timeout-minutes: 4
        run: |
          dotnet build samples/AsyncNetworking/AsyncNetworking.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot samples/AsyncNetworking/bin/Release/net8.0/AsyncNetworking.dll /tmp/async-networking.c
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/async-networking.c tests/network_host.c source/managed_runtime.c source/async_runtime.c source/text.c source/network.c source/network_posix.c -o /tmp/async-networking
          python3 tests/network_fixtures.py /tmp/async-networking
          python3 tests/network_fixtures.py /tmp/async-networking --gc-stress
      - name: Convert, package and validate model assets
        timeout-minutes: 5
        run: |
          sudo apt-get install -y assimp-utils
          assimp version
          dotnet run --project tests/ModelAssetTests/ModelAssetTests.csproj -c Release -- /tmp/dnd-model-fixtures /usr/bin/assimp
          test -s /tmp/dnd-model-fixtures/sd/geometry-gj.dndmodel
          test -s /tmp/dnd-model-fixtures/sd/geometry-xj.dndmodel
          test -s /tmp/dnd-model-fixtures/sd/live.obj
          dotnet pack tools/DolphinDotNet.Assets/DolphinDotNet.Assets.csproj -c Release -o /tmp/dnd-tools
          dotnet tool install DolphinDotNet.Assets --version 0.1.0 --add-source /tmp/dnd-tools --tool-path /tmp/dnd-tool-install
          /tmp/dnd-tool-install/dnd-assets --help
          dotnet build /tmp/dnd-model-fixtures/Build.csproj -c Release -p:DndAssetsCommand=/tmp/dnd-tool-install/dnd-assets
          cmp /tmp/dnd-model-fixtures/sd/animated.dndmodel /tmp/dnd-model-fixtures/sd/built.dndmodel
          cc -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude tests/model_inflate_test.c source/model_ufbx.c -lm -o /tmp/model-inflate
          /tmp/model-inflate
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude tests/model_test.c source/managed_runtime.c source/async_runtime.c source/storage.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -lm -o /tmp/model-native
          timeout 30s /tmp/model-native /tmp/dnd-model-fixtures
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude tests/model_test.c source/managed_runtime.c source/async_runtime.c source/storage.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -lm -o /tmp/model-native32
          timeout 30s /tmp/model-native32 /tmp/dnd-model-fixtures
      - name: Validate model AOT, transforms, animation and ARAM residency
        timeout-minutes: 5
        run: |
          dotnet build tests/ModelSmoke/ModelSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/ModelSmoke/bin/Release/net8.0/ModelSmoke.dll /tmp/model-smoke.c
          # Avoid pathological sanitizer compile times for large generated state machines.
          # Native code stays optimized; the 32-bit pass below also optimizes generated C.
          cc -pthread -O0 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/model-smoke.c -o /tmp/model-smoke-generated.o
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/model-smoke-generated.o tests/model_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/aram.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -lm -o /tmp/model-smoke
          timeout 30s /tmp/model-smoke /tmp/dnd-model-fixtures
          dotnet run --project tests/ModelAssetTests/ModelAssetTests.csproj -c Release -- /tmp/dnd-model-fixtures
          timeout 30s /tmp/model-smoke /tmp/dnd-model-fixtures --gc-stress
          dotnet run --project tests/ModelAssetTests/ModelAssetTests.csproj -c Release -- /tmp/dnd-model-fixtures
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/model-smoke.c tests/model_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/aram.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -lm -o /tmp/model-smoke32
          timeout 30s /tmp/model-smoke32 /tmp/dnd-model-fixtures --gc-stress

      - name: Validate background model awaits, rendering and in-flight cancellation
        timeout-minutes: 5
        env:
          DND_ASYNC_MANUAL: "0"
        run: |
          dotnet build tests/ModelAsyncSmoke/ModelAsyncSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/ModelAsyncSmoke/bin/Release/net8.0/ModelAsyncSmoke.dll /tmp/model-async.c
          cc -pthread -O0 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/model-async.c -o /tmp/model-async-generated.o
          cc -pthread -O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/model-async-generated.o tests/model_async_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/aram.c source/timing.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -Wl,--wrap=ufbx_load_memory -lm -o /tmp/model-async
          timeout 30s /tmp/model-async /tmp/dnd-model-fixtures
          timeout 30s /tmp/model-async /tmp/dnd-model-fixtures --gc-stress
          cc -pthread -m32 -O2 -std=c11 -Wall -Wextra -Werror -Iinclude /tmp/model-async.c tests/model_async_host.c source/managed_runtime.c source/async_runtime.c source/storage.c source/aram.c source/timing.c source/model*.c source/graphics_device.c source/draw_resources.c source/graphics_gx.c source/performance.c -Wl,--wrap=ufbx_load_memory -lm -o /tmp/model-async32
          timeout 30s /tmp/model-async32 /tmp/dnd-model-fixtures --gc-stress

  ide-workflow:
    name: IDE workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the shared driver and launch probe
        run: |
          dotnet build tools/DolphinDotNet.Build
          dotnet build tests/DolphinLaunchProbe
      - name: Validate launch lifecycle and MSBuild integration
        run: python tests/build_workflow_test.py
      - name: Build every sample solution without a native toolchain
        shell: pwsh
        run: |
          Get-ChildItem samples/*/*.sln | ForEach-Object {
            dotnet build $_.FullName -p:DndBuildNative=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build every sample with the container backend
        if: runner.os == 'Linux'
        run: |
          for solution in samples/*/*.sln; do
            dotnet build "$solution" -p:DndBuildBackend=Docker
            sample=$(basename "$solution" .sln)
            python scripts/dol_sections.py "samples/$sample/bin/Debug/net8.0/$sample.dol"
          done

  portable-runtime:
    name: Portable runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test runtime
        run: |
          make -C tests test
          make -C tests clean
          make -C tests test CFLAGS='-O2 -g -fsanitize=address,undefined -fno-sanitize-recover=all -std=c11 -Wall -Wextra -Werror -I../include'

  gamecube:
    name: GameCube DOL
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:20260805@sha256:13bb658d3f18903816617223f5d7c6f776d3db3ea806aae67f8d35a7a69d4c85
    steps:
      - uses: actions/checkout@v4
      - name: Verify libogc2 storage and GX packages
        run: |
          test -f "$DEVKITPRO/libogc2/gamecube/include/fat.h"
          dkp-pacman -Q | grep -E 'libogc2|devkitPPC'
      - name: Locate libogc installation
        run: |
          find "$DEVKITPRO" -name gccore.h -print
          find "$DEVKITPRO" -name 'libogc.a' -print
          test -f "$DEVKITPRO/libogc2/gamecube/include/gccore.h"
          test -f "$DEVKITPRO/libogc2/gamecube/lib/libogc.a"
          find "$DEVKITPRO" -name 'libbba.a' -o -name 'liblwip.a' -o -name 'libnetwork*.a' -print
      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate managed GameCube AOT source
        run: |
          dotnet build samples/ManagedGameCube/ManagedGameCube.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll generated/managed_gamecube.c
      - name: Build generated standalone GameCube project
        run: |
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-standalone --platform gamecube
          make -C /tmp/dnd-standalone V=1
          test -s /tmp/dnd-standalone/Game.elf
          test -s /tmp/dnd-standalone/Game.dol
          python3 /tmp/dnd-standalone/scripts/dol_sections.py /tmp/dnd-standalone/Game.dol
      - name: Link opt-in GDB TCP GameCube bundle
        run: |
          test -f "$DEVKITPRO/libogc2/gamecube/lib/libdb.a"
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/ManagedGameCube/bin/Release/net8.0/ManagedGameCube.dll /tmp/dnd-gdb-ppc --gdb-tcp 192.0.2.10 --gdb-netmask 255.255.255.0 --gdb-gateway 192.0.2.1
          make -C /tmp/dnd-gdb-ppc
          test -s /tmp/dnd-gdb-ppc/Game.dol
          "$DEVKITPPC/bin/powerpc-eabi-readelf" -SW /tmp/dnd-gdb-ppc/Game.elf | grep -q '\.debug_info'
          "$DEVKITPPC/bin/powerpc-eabi-nm" /tmp/dnd-gdb-ppc/Game.elf | grep -q ' dnd_gdb_init$'
          "$DEVKITPPC/bin/powerpc-eabi-readelf" --debug-dump=decodedline /tmp/dnd-gdb-ppc/Game.elf | grep -q 'ManagedGameCube.*\.cs'
      - name: Link managed AESND sample to a real GameCube DOL
        run: |
          dotnet build samples/AudioDemo/AudioDemo.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/AudioDemo/bin/Release/net8.0/AudioDemo.dll /tmp/dnd-audio-demo-ppc --platform gamecube
          make -C /tmp/dnd-audio-demo-ppc
          test -s /tmp/dnd-audio-demo-ppc/Game.dol
          python3 /tmp/dnd-audio-demo-ppc/scripts/dol_sections.py /tmp/dnd-audio-demo-ppc/Game.dol
      - name: Link GameCube audio format loaders and async API
        run: |
          dotnet build tests/AudioFormatsSmoke -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle tests/AudioFormatsSmoke/bin/Release/net8.0/AudioFormatsSmoke.dll /tmp/dnd-audio-formats-ppc --platform gamecube
          make -C /tmp/dnd-audio-formats-ppc
          python3 /tmp/dnd-audio-formats-ppc/scripts/dol_sections.py /tmp/dnd-audio-formats-ppc/Game.dol
      - name: Build and validate self-contained Pong GameCube DOL
        run: |
          dotnet build samples/Pong/Pong.sln -c Release -p:DndBuildBackend=Native
          test -s samples/Pong/bin/Release/net8.0/Pong.dol
          python3 scripts/dol_sections.py samples/Pong/bin/Release/net8.0/Pong.dol
          mkdir -p footprint
          cp samples/Pong/bin/Release/net8.0/Pong.dol footprint/pong.dol
          cp samples/Pong/bin/Release/net8.0/Pong.elf footprint/pong.elf
      - name: Build and validate Snake save/load GameCube DOL
        run: |
          dotnet build samples/Snake/Snake.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/Snake/bin/Release/net8.0/Snake.dll /tmp/dnd-snake-gamecube --platform gamecube
          make -C /tmp/dnd-snake-gamecube
          test -s /tmp/dnd-snake-gamecube/Game.dol
          python3 /tmp/dnd-snake-gamecube/scripts/dol_sections.py /tmp/dnd-snake-gamecube/Game.dol
          mkdir -p footprint
          cp /tmp/dnd-snake-gamecube/Game.dol footprint/snake.dol
          cp /tmp/dnd-snake-gamecube/Game.elf footprint/snake.elf
      - name: Build GameCube hardware discovery and reboot demo DOL
        run: |
          dotnet build samples/HardwareDiagnostics/HardwareDiagnostics.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/HardwareDiagnostics/bin/Release/net8.0/HardwareDiagnostics.dll /tmp/dnd-hardware-demo --platform gamecube
          make -C /tmp/dnd-hardware-demo
          test -s /tmp/dnd-hardware-demo/Game.dol
      - name: Build GameCube disc browser with libogc2 GC Loader sectors
        run: |
          dotnet build samples/DiscBrowser/DiscBrowser.csproj -c Release -p:DndBuildNative=false
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle samples/DiscBrowser/bin/Release/net8.0/DiscBrowser.dll /tmp/dnd-disc-browser-bundle --platform gamecube
          test -s /tmp/dnd-disc-browser-bundle/source/iso_file.c
          test -s /tmp/dnd-disc-browser-bundle/source/hardware.c
          make -C /tmp/dnd-disc-browser-bundle
          test -s /tmp/dnd-disc-browser-bundle/Game.dol
          test -s /tmp/dnd-disc-browser-bundle/source/model_obj.c
      - name: Compile managed storage ABI for PowerPC
        run: |
          dotnet build tests/StorageSmoke/StorageSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/StorageSmoke/bin/Release/net8.0/StorageSmoke.dll /tmp/storage_smoke.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/storage_smoke.c -o /tmp/storage_smoke.o
      - name: Compile standard library ABI for PowerPC
        run: |
          dotnet build tests/LibrarySmoke/LibrarySmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/LibrarySmoke/bin/Release/net8.0/LibrarySmoke.dll /tmp/library.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/library.c -o /tmp/library.o
      - name: Compile managed ARAM ABI for PowerPC
        run: |
          dotnet build tests/AramSmoke/AramSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/AramSmoke/bin/Release/net8.0/AramSmoke.dll /tmp/aram.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/aram.c -o /tmp/aram.o
      - name: Compile model and animation ABI for PowerPC
        run: |
          dotnet build tests/ModelSmoke/ModelSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler/DolphinDotNet.Compiler.csproj -- --aot tests/ModelSmoke/bin/Release/net8.0/ModelSmoke.dll /tmp/model-smoke.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/model-smoke.c -o /tmp/model-smoke.o
      - name: Compile and link graphics layers for PowerPC
        run: |
          dotnet build tests/GraphicsSmoke/GraphicsSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --bundle tests/GraphicsSmoke/bin/Release/net8.0/GraphicsSmoke.dll /tmp/dnd-graphics --platform gamecube
          make -C /tmp/dnd-graphics V=1
          test -s /tmp/dnd-graphics/Game.dol
      - name: Test DOL alignment handling
        run: python3 -m unittest discover -s tests -p test_dol_sections.py
      - name: Build corrected project-owned EXI implementation
        run: bash scripts/build_exi_overlay.sh
      - name: Build ELF and DOL
        run: make V=1
      - name: Build bare-metal ELF/DOL to test emulator debugger
        run: |
          mkdir -p footprint
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -c -g tests/dolphin_minimal.S -o footprint/dolphin_minimal.o
          "$DEVKITPPC/bin/powerpc-eabi-ld" -Ttext=0x80003100 -e main -o footprint/dolphin_minimal.elf footprint/dolphin_minimal.o
          elf2dol footprint/dolphin_minimal.elf footprint/dolphin_minimal.dol
          python3 scripts/dol_sections.py --pad footprint/dolphin_minimal.dol
      - name: Build independent libogc emulator control DOL
        run: |
          mkdir -p footprint
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -I"$DEVKITPRO/libogc2/gamecube/include" tests/dolphin_control.c -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/dolphin_control.elf
          elf2dol footprint/dolphin_control.elf footprint/dolphin_control.dol
          python3 scripts/dol_sections.py --pad footprint/dolphin_control.dol
      - name: Compile and link managed networking for GameCube
        run: |
          dotnet build tests/NetworkSmoke/NetworkSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/NetworkSmoke/bin/Release/net8.0/NetworkSmoke.dll /tmp/network-smoke.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/network-smoke.c -o /tmp/network-smoke.o
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -mogc -Iinclude tests/network_gamecube_entry.c /tmp/network-smoke.o build/managed_runtime.o build/async_runtime.o build/text.o build/network.o build/network_gamecube_backend.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -lbba -logc -lm -o /tmp/network-smoke.elf
      - name: Build automatic task execution DOL
        run: |
          dotnet build tests/AutomaticTaskSmoke/AutomaticTaskSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/AutomaticTaskSmoke/bin/Release/net8.0/AutomaticTaskSmoke.dll /tmp/automatic-tasks.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -std=gnu11 -O2 -Wall -Wextra -Werror -DGEKKO -mogc -mcpu=750 -meabi -mhard-float -Iinclude -c /tmp/automatic-tasks.c -o /tmp/automatic-tasks.o
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/automatic-tasks.o build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/automatic_tasks.elf
          elf2dol footprint/automatic_tasks.elf footprint/automatic_tasks.dol
          python3 scripts/dol_sections.py --pad footprint/automatic_tasks.dol
      - name: Compile and link controller and timing ABI for PowerPC
        run: |
          dotnet build tests/InputSmoke/InputSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/InputSmoke/bin/Release/net8.0/InputSmoke.dll /tmp/input-smoke.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/input-smoke.c build/input.o build/input_gamecube.o build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o /tmp/input-smoke.elf
          dotnet build tests/InputContextSmoke/InputContextSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/InputContextSmoke/bin/Release/net8.0/InputContextSmoke.dll /tmp/input-contexts.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/input-contexts.c build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o /tmp/input-contexts.elf
          dotnet build tests/TimingSmoke/TimingSmoke.csproj -c Release
          dotnet run --project tools/DolphinDotNet.Compiler -- --aot tests/TimingSmoke/bin/Release/net8.0/TimingSmoke.dll /tmp/timing-smoke.c
          "$DEVKITPPC/bin/powerpc-eabi-gcc" -O2 -Wall -Wextra -Werror -DGEKKO -mogc -Iinclude -I"$DEVKITPRO/libogc2/gamecube/include" tests/automatic_tasks_gamecube_entry.c /tmp/timing-smoke.c build/timing.o build/managed_runtime.o build/async_runtime.o -Lbuild/exi-overlay -L"$DEVKITPRO/libogc2/gamecube/lib" -logc -lm -o footprint/timing_tasks.elf
          elf2dol footprint/timing_tasks.elf footprint/timing_tasks.dol
          python3 scripts/dol_sections.py --pad footprint/timing_tasks.dol
      - name: Report GameCube runtime footprint
        run: |
          mkdir -p footprint
          "$DEVKITPPC/bin/powerpc-eabi-size" DolphinDotNet.elf > footprint/elf-size.txt
          "$DEVKITPPC/bin/powerpc-eabi-nm" -S --size-sort DolphinDotNet.elf > footprint/symbol-sizes.txt
          cat footprint/elf-size.txt
          grep managed_heap_memory footprint/symbol-sizes.txt
          find build -name '*.su' -exec cat {} + > footprint/stack-usage.txt
          test -s footprint/stack-usage.txt
          cat footprint/stack-usage.txt
      - name: Verify outputs
        run: |
          test -s DolphinDotNet.elf
          test -s DolphinDotNet.dol
          python3 scripts/dol_sections.py DolphinDotNet.dol
          python3 scripts/verify_dol_elf.py DolphinDotNet.elf DolphinDotNet.dol
          "$DEVKITPPC/bin/powerpc-eabi-readelf" -h -l DolphinDotNet.elf > footprint/elf-headers.txt
          "$DEVKITPPC/bin/powerpc-eabi-objdump" -d DolphinDotNet.elf > footprint/powerpc-disassembly.txt
          test -s footprint/elf-headers.txt
          test -s footprint/powerpc-disassembly.txt
          file DolphinDotNet.elf || true
          ls -lh DolphinDotNet.elf DolphinDotNet.dol
      - uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-gamecube
          path: |
            DolphinDotNet.elf
            DolphinDotNet.dol
            DolphinDotNet.map
            footprint/
          if-no-files-found: error

  dolphin-smoke:
    name: Dolphin headless DOL boot
    runs-on: ubuntu-24.04
    needs: gamecube
    container:
      image: debian:trixie
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker shared memory
        run: |
          df -h /dev/shm
          test "$(stat -f -c %a /dev/shm)" -gt 100000
      - name: Install Dolphin and virtual display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb xauth python3 binutils libxcb-cursor0
          test -x /usr/games/dolphin-emu-nogui
          xvfb-run -a /usr/games/dolphin-emu-nogui --version
      - name: Download GameCube DOL
        uses: actions/download-artifact@v4
        with:
          name: DolphinDotNet-gamecube
          path: dist
      - name: Test emulator log validation
        run: python3 -m unittest discover -s tests -p test_dolphin_smoke.py
      - name: Verify Pong synthesizes audio and presents frames in Dolphin
        id: pong_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/pong.dol --binary /usr/games/dolphin-emu-nogui --seconds 65 --cpu-core 1 --gdb-port 2163 --elf dist/footprint/pong.elf --expect-symbol main --expect-symbol dnd_aot_entry --expect-symbol dnd_audio_create_pcm8 --expect-symbol dnd_device_end --logs dolphin-pong --require-boot
      - name: Verify Snake memory card initialization and frame rendering in Dolphin
        id: snake_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/snake.dol --binary /usr/games/dolphin-emu-nogui --seconds 70 --cpu-core 1 --gdb-port 2164 --elf dist/footprint/snake.elf --expect-symbol main --expect-symbol dnd_aot_entry --expect-symbol dnd_card_mount --expect-symbol dnd_device_end --logs dolphin-snake --require-boot
      - name: Verify bare-metal main() guest PC
        id: minimal_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/dolphin_minimal.dol --binary /usr/games/dolphin-emu-nogui --seconds 12 --cpu-core 1 --gdb-port 2158 --elf dist/footprint/dolphin_minimal.elf --expect-symbol main --logs dolphin-minimal --require-boot
      - name: Verify independent libogc main() guest PC
        id: control_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/dolphin_control.dol --binary /usr/games/dolphin-emu-nogui --seconds 40 --cpu-core 1 --gdb-port 2159 --elf dist/footprint/dolphin_control.elf --expect-symbol main --logs dolphin-control --require-boot
      - name: Verify native and managed main() executed in Dolphin
        id: app_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/DolphinDotNet.dol --binary /usr/games/dolphin-emu-nogui --seconds 55 --cpu-core 1 --gdb-port 2160 --elf dist/DolphinDotNet.elf --expect-symbol main --expect-symbol dnd_aot_entry --expect-symbol "dnd_value_ManagedGameCube_Program_Main_*" --logs dolphin-smoke --require-boot
      - name: Verify automatic async tasks complete and the service thread shuts down
        id: async_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/automatic_tasks.dol --binary /usr/games/dolphin-emu-nogui --seconds 40 --cpu-core 1 --gdb-port 2161 --elf dist/footprint/automatic_tasks.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-async --require-boot
      - name: Verify timing delays, callbacks and cleanup in Dolphin
        id: timing_boot
        continue-on-error: true
        run: python3 scripts/dolphin_smoke.py dist/footprint/timing_tasks.dol --binary /usr/games/dolphin-emu-nogui --seconds 40 --cpu-core 1 --gdb-port 2162 --elf dist/footprint/timing_tasks.elf --expect-word dnd_async_test_result=0x4153594e --memory-after-symbol dnd_async_test_done --logs dolphin-timing --require-boot
      - name: Require both guest entry-point checks
        if: always()
        run: |
          echo "Bare-metal DOL: ${{ steps.minimal_boot.outcome }}"
          echo "Control DOL: ${{ steps.control_boot.outcome }}"
          echo "DolphinDotNet DOL: ${{ steps.app_boot.outcome }}"
          test "${{ steps.minimal_boot.outcome }}" = success
          test "${{ steps.control_boot.outcome }}" = success
          test "${{ steps.app_boot.outcome }}" = success
          test "${{ steps.async_boot.outcome }}" = success
          test "${{ steps.timing_boot.outcome }}" = success
          test "${{ steps.pong_boot.outcome }}" = success
          test "${{ steps.snake_boot.outcome }}" = success
      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-dolphin-smoke
          path: |
            dolphin-minimal/
            dolphin-control/
            dolphin-smoke/
            dolphin-async/
            dolphin-timing/
            dolphin-pong/
            dolphin-snake/
          if-no-files-found: warn

  release-gamecube:
    name: Publish GameCube build release
    runs-on: ubuntu-latest
    needs:
      - managed
      - ide-workflow
      - portable-runtime
      - gamecube
      - dolphin-smoke
    # Publish successful builds of main only; pull requests retain their Actions artifacts.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Download verified GameCube build
        uses: actions/download-artifact@v4
        with:
          name: DolphinDotNet-gamecube
          path: dist
      - name: Verify release files
        run: |
          test -s dist/DolphinDotNet.dol
          test -s dist/DolphinDotNet.elf
      - name: Create downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TAG="build-${BUILD_RUN}-${BUILD_ATTEMPT}"
          gh release create "$TAG" \
            dist/DolphinDotNet.dol \
            dist/DolphinDotNet.elf \
            --target "$BUILD_SHA" \
            --title "GameCube build ${BUILD_RUN} (attempt ${BUILD_ATTEMPT})" \
            --notes "Automated GameCube DOL build from commit ${BUILD_SHA}. Built and verified by CI run https://github.com/${GH_REPO}/actions/runs/${BUILD_RUN}." \
            --prerelease
