name: TextureStrategy in Dolphin

on:
  push:
    branches: [main, experiment/virtual-texture-vs-atlas, codex/texture-strategy-startup-diagnostics, codex/texture-residency-streaming, codex/texture-comparison-mode]
  pull_request:
    paths:
      - 'samples/TextureStrategy/**'
      - 'source/**'
      - 'include/**'
      - 'src/**'
      - 'sdk/**'
      - 'tools/DolphinDotNet.Compiler/**'
      - 'tools/DolphinDotNet.Build/**'
      - 'scripts/**'
      - 'tests/*dolphin*'
      - 'tests/TextureStreamingTests/**'
      - '.github/workflows/texture-dolphin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texture-dolphin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Dolphin / ${{ matrix.configuration }} / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        mode: [pages, atlas]
        include:
          - configuration: Release
            mode: benchmark
          - configuration: Debug
            mode: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the Debian Dolphin runtime
        run: |
          docker build -t dnd-dolphin - <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends dolphin-emu xvfb xauth ffmpeg python3 libgl1-mesa-dri libglx-mesa0 && rm -rf /var/lib/apt/lists/*
          EOF
          docker run --rm dnd-dolphin /usr/games/dolphin-emu-nogui --version
      - name: Test the acceptance oracle and native failure diagnostics
        run: |
          docker run --rm --mount "type=bind,source=${{ github.workspace }},target=/src" \
            -w /src dnd-dolphin sh -ec '
              command -v ffmpeg
              python3 -m unittest discover -s tests -p test_dolphin_texture.py
              python3 -m unittest discover -s tests -p test_dolphin_streaming.py
              python3 -m unittest discover -s tests -p test_dolphin_benchmark.py
            '
          dotnet run --project tests/TextureStreamingTests -c Release
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/native_main_failure_test.c -o /tmp/dnd-main-test
          /tmp/dnd-main-test
          make -C tests overlay_test overlay_debug_test
          ./tests/overlay_test
          ./tests/overlay_debug_test
      - name: Build the actual GameCube DOL with the Docker backend
        run: >-
          dotnet build samples/TextureStrategy/TextureStrategy.csproj
          -c ${{ matrix.configuration }} -m:1
          -p:DndBuildBackend=Docker -p:DndTextureStreamingCI=true
          -p:DndTextureAtlasStart=${{ matrix.mode == 'atlas' && 'true' || 'false' }}
          -p:DndTextureBenchmarkCI=${{ matrix.mode == 'benchmark' && 'true' || 'false' }}
      - name: Boot Dolphin and require sustained textured frames
        run: >-
          docker run --rm --shm-size=512m --mount "type=bind,source=${{ github.workspace }},target=/src"
          -w /src dnd-dolphin python3 scripts/dolphin_texture_test.py
          samples/TextureStrategy/bin/${{ matrix.configuration }}/net8.0/TextureStrategy.dol
          --mode ${{ matrix.mode == 'atlas' && 'atlas' || 'pages' }} --streaming
          ${{ matrix.mode == 'benchmark' && '--benchmark' || '' }} --backend OGL
          --seconds ${{ matrix.mode == 'benchmark' && '360' || '90' }}
          --logs out/dolphin-texture
      - name: Preserve compact frame and telemetry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-proof-${{ matrix.configuration }}-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            out/dolphin-texture/frame.png
            out/dolphin-texture/benchmark-summary.png
            out/dolphin-texture/results.json
            out/dolphin-texture/diagnostics.json
            out/dolphin-texture/mismatch.png
            out/dolphin-texture/mismatch.json
            out/dolphin-texture/emulator.log
            samples/TextureStrategy/bin/${{ matrix.configuration }}/net8.0/TextureStrategy.dol
            samples/TextureStrategy/bin/${{ matrix.configuration }}/net8.0/TextureStrategy.elf
      - name: Preserve DOL, ELF, emulator logs, capture and pixel proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-dolphin-${{ matrix.configuration }}-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            out/dolphin-texture/
            samples/TextureStrategy/bin/${{ matrix.configuration }}/net8.0/*.dol
            samples/TextureStrategy/bin/${{ matrix.configuration }}/net8.0/*.elf

      - name: Build the interactive hardware DOL
        if: success() && matrix.mode == 'benchmark' && matrix.configuration == 'Release'
        run: >-
          dotnet build samples/TextureStrategy/TextureStrategy.csproj
          -c Release -m:1 -p:DndBuildBackend=Docker
          -p:DndTextureStreamingCI=false -p:DndTextureBenchmarkCI=false
      - name: Preserve interactive hardware DOL and timing instructions
        if: success() && matrix.mode == 'benchmark' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: texture-hardware-Release
          if-no-files-found: error
          path: |
            samples/TextureStrategy/bin/Release/net8.0/TextureStrategy.dol
            samples/TextureStrategy/bin/Release/net8.0/TextureStrategy.elf
            docs/texture-stage-timings.md
