name: NuGet preview
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'sdk/**'
      - 'src/**'
      - 'tools/**'
      - 'source/**'
      - 'include/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'templates/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'tests/sdk_consumer.py'
      - '.github/workflows/nuget-preview.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested preview packages to NuGet from main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - id: version
        run: echo "version=0.1.0-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - run: python3 eng/pack.py --include-tools --version '${{ steps.version.outputs.version }}'
      - run: dotnet run --project tests/CardRecordStoreTests -c Release
      - run: dotnet build tests/CardRecordStoreSmoke -c Release
      - run: dotnet run --project tools/DolphinDotNet.Compiler -c Release -- --bundle tests/CardRecordStoreSmoke/bin/Release/net8.0/CardRecordStoreSmoke.dll out/card-record-smoke
      - run: python3 tests/sdk_consumer.py --workspace "$RUNNER_TEMP/external consumer"
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-preview
          path: out/packages/*.nupkg
          if-no-files-found: error
  dotnet11:
    name: External SDK consumers / .NET 11
    needs: verify
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Use a separate installation so the runner's .NET 8 runtime cannot hide
      # launch failures in tools shipped inside the SDK or optional tool packages.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet11
        with:
          dotnet-version: '11.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-preview
          path: out/packages
      - name: Verify isolated .NET 11 host
        run: |
          dotnet --info
          python3 - <<'PYTHON'
          import subprocess
          runtimes = subprocess.check_output(['dotnet', '--list-runtimes'], text=True)
          assert 'Microsoft.NETCore.App 11.' in runtimes, runtimes
          assert 'Microsoft.NETCore.App 8.' not in runtimes, runtimes
          PYTHON
      - name: Build source SDK with .NET 11
        run: dotnet build DolphinDotNet.sln -c Debug --nologo
      - name: Validate source compiler with .NET 11
        run: dotnet run --project tools/DolphinDotNet.Compiler.Tests -c Release
      - name: Build and AOT compile net11.0 consumers
        run: python3 tests/sdk_consumer.py --framework net11.0 --workspace "$RUNNER_TEMP/external consumer"
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [verify, dotnet11]
    runs-on: macos-15-intel
    environment: nuget-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-preview
          path: packages
      - name: Validate trusted-publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER variable in the nuget-preview environment to your NuGet profile username."
            exit 1
          fi
      - name: Authenticate to NuGet with GitHub OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified preview packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Verify published packages restore
        timeout-minutes: 6
        env:
          PUBLISHED_SDK_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, tempfile, time
          version = os.environ['PUBLISHED_SDK_VERSION']
          with tempfile.TemporaryDirectory(prefix='published-sdk-consumer-') as directory:
              root = pathlib.Path(directory)
              project = root / 'PublishedSdkConsumer.csproj'
              project.write_text('<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="DolphinDotNet.GameCube" Version="[' + version + ']" /></ItemGroup></Project>')
              config = root / 'NuGet.Config'
              config.write_text('<configuration><packageSources><clear /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>')
              for attempt in range(10):
                  result = subprocess.run(['dotnet', 'restore', str(project), '--configfile', str(config), '--packages', str(root / 'packages'), '--use-lock-file', '--no-cache', '--force-evaluate'], text=True, capture_output=True, timeout=30)
                  if result.returncode == 0:
                      break
                  print(result.stdout[-2000:] + result.stderr[-2000:], flush=True)
                  if attempt == 9:
                      raise RuntimeError('Published SDK packages did not become restorable')
                  time.sleep(5)
              locked = json.loads((root / 'packages.lock.json').read_text())['dependencies']['net8.0']
              hashes = {}
              for name in ('DolphinDotNet.Core', 'DolphinDotNet.GameCube'):
                  package = locked[name]
                  if package['resolved'] != version or not package.get('contentHash'):
                      raise RuntimeError('Published SDK dependency identity differs: ' + name)
                  hashes[name] = {'version': package['resolved'], 'contentHash': package['contentHash']}
              print('PUBLISHED_PACKAGE_HASHES ' + json.dumps(hashes, sort_keys=True), flush=True)
          PYTHON
