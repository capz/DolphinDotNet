name: GameCube ELF launcher
on:
  pull_request:
    paths:
      - 'tools/DolphinDotNet.Launcher/**'
      - '.github/workflows/launcher.yml'
      - 'scripts/dol_sections.py'
      - 'scripts/verify_dol_elf.py'
  push:
    branches: [main]
    paths:
      - 'tools/DolphinDotNet.Launcher/**'
      - '.github/workflows/launcher.yml'
      - 'scripts/dol_sections.py'
      - 'scripts/verify_dol_elf.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiver-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test production ELF validator and protocol with sanitizers
        working-directory: tools/DolphinDotNet.Launcher
        run: make -f tests/Makefile test 'HOST_CFLAGS=-std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined'
      - name: Test independent host wire vectors
        working-directory: tools/DolphinDotNet.Launcher
        run: python3 tests/wire_test.py
  resident-powerpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bootable resident launcher with pinned native toolchain
        run: >-
          docker run --rm --mount "type=bind,source=${{ github.workspace }},target=/src"
          -w /src/tools/DolphinDotNet.Launcher
          ghcr.io/extremscorner/libogc2@sha256:13bb658d3f18903816617223f5d7c6f776d3db3ea806aae67f8d35a7a69d4c85
          make -j2
      - name: Install test-only PowerPC emulator
        run: python -m pip install unicorn==2.1.4
      - name: Execute linked bootstrap and repeated return paths
        working-directory: tools/DolphinDotNet.Launcher
        run: python tests/resident_cpu_test.py
      - name: Verify bootable DOL matches the linked launcher
        run: >-
          python scripts/verify_dol_elf.py
          tools/DolphinDotNet.Launcher/build/DolphinDotNet.Launcher.elf
          tools/DolphinDotNet.Launcher/build/DolphinDotNet.Launcher.dol
      - name: Upload bootable launcher
        uses: actions/upload-artifact@v4
        with:
          name: DolphinDotNet-ELF-launcher
          path: tools/DolphinDotNet.Launcher/build/DolphinDotNet.Launcher.dol
          if-no-files-found: error
